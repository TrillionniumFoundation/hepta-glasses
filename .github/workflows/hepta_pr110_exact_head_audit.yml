name: hepta-pr110-exact-head-audit

on:
  push:
    branches:
      - 'ops/hepta-pr110-format-20260909-v1'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hepta-pr110-exact-head-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for and audit the immutable PR 110 packet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import stat
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath

          REPO = os.environ["GH_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"
          PR = 110
          BRANCH = "codex/hepta-critical-test-depth-20260908"
          EXPECTED_JOBS = {
              "repository-contracts",
              "flutter",
              "android-native",
              "ios-native",
              "native-sanitizers",
              "secret-and-boundary-scan",
              "source-evidence",
          }
          EXPECTED_MEMBERS = {
              "source-evidence-summary.json",
              "source-gate-result.json",
              "source-history-scan.json",
              "source-native-sanitizer.json",
              "source-provenance.json",
              "source-release-bundle.json",
              "source-sbom.spdx.json",
          }

          def request(path: str, *, method: str = "GET", body=None, accept="application/vnd.github+json"):
              url = path if path.startswith("https://") else API + path
              data = None if body is None else json.dumps(body, separators=(",", ":")).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "hepta-pr110-exact-head-audit/1",
                      "X-GitHub-Api-Version": "2022-11-28",
                      **({"Content-Type": "application/json"} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read()
                  return response.status, response.headers, payload

          def get_json(path: str):
              _, _, payload = request(path)
              return json.loads(payload)

          def closed_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise AssertionError(f"duplicate JSON member: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise AssertionError(f"non-finite JSON value: {value}")

          def strict_json(raw: bytes):
              return json.loads(
                  raw.decode("utf-8"),
                  object_pairs_hook=closed_pairs,
                  parse_constant=reject_constant,
              )

          encoded_branch = urllib.parse.quote(BRANCH, safe="")
          ref = get_json(f"/repos/{REPO}/git/ref/heads/{BRANCH}")
          head = ref["object"]["sha"]
          assert len(head) == 40
          commit = get_json(f"/repos/{REPO}/commits/{head}")
          tree = commit["commit"]["tree"]["sha"]
          assert len(tree) == 40

          run = None
          deadline = time.monotonic() + 20 * 60
          while time.monotonic() < deadline:
              latest_ref = get_json(f"/repos/{REPO}/git/ref/heads/{BRANCH}")["object"]["sha"]
              assert latest_ref == head, f"candidate moved during audit: {head} -> {latest_ref}"
              runs = get_json(
                  f"/repos/{REPO}/actions/workflows/ci.yml/runs?branch={encoded_branch}&per_page=50"
              )["workflow_runs"]
              matches = [item for item in runs if item.get("head_sha") == head and item.get("event") == "pull_request"]
              if matches:
                  candidate = max(matches, key=lambda item: item["run_number"])
                  if candidate["status"] == "completed":
                      run = candidate
                      break
              time.sleep(20)
          assert run is not None, "no completed canonical run for the unchanged head"
          assert run["conclusion"] == "success", f"canonical run failed: {run['html_url']}"

          jobs = get_json(f"/repos/{REPO}/actions/runs/{run['id']}/jobs?per_page=100")["jobs"]
          assert len(jobs) == 7, [job["name"] for job in jobs]
          assert {job["name"] for job in jobs} == EXPECTED_JOBS
          for job in jobs:
              assert job["status"] == "completed"
              assert job["conclusion"] == "success", (job["name"], job["conclusion"])
              assert job.get("steps"), f"empty job: {job['name']}"
              for step in job["steps"]:
                  assert step["status"] == "completed"
                  assert step["conclusion"] in {"success", "skipped"}, (job["name"], step)

          artifacts = get_json(f"/repos/{REPO}/actions/runs/{run['id']}/artifacts?per_page=100")["artifacts"]
          expected_name = f"hepta-source-evidence-{head}"
          matches = [item for item in artifacts if item["name"] == expected_name and not item["expired"]]
          assert len(matches) == 1, [(item["name"], item["expired"]) for item in artifacts]
          artifact = matches[0]
          _, _, archive = request(
              f"/repos/{REPO}/actions/artifacts/{artifact['id']}/zip",
              accept="application/vnd.github+json",
          )
          zip_digest = hashlib.sha256(archive).hexdigest()
          server_digest = artifact.get("digest")
          if server_digest is not None:
              assert server_digest == f"sha256:{zip_digest}", (server_digest, zip_digest)

          with zipfile.ZipFile(io.BytesIO(archive)) as package:
              infos = package.infolist()
              names = [info.filename for info in infos]
              assert len(names) == 7 and len(set(names)) == 7 and set(names) == EXPECTED_MEMBERS
              assert package.testzip() is None
              raw = {}
              for info in infos:
                  path = PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not path.is_absolute() and ".." not in path.parts
                  assert "\\" not in info.filename and "\x00" not in info.filename
                  assert not info.is_dir()
                  assert mode == 0 or stat.S_ISREG(mode)
                  raw[info.filename] = package.read(info)

          objects = {name: strict_json(value) for name, value in raw.items()}
          digests = {name: hashlib.sha256(value).hexdigest() for name, value in raw.items()}
          summary = objects["source-evidence-summary.json"]
          gate = objects["source-gate-result.json"]
          history = objects["source-history-scan.json"]
          native = objects["source-native-sanitizer.json"]
          provenance = objects["source-provenance.json"]
          release_document = objects["source-release-bundle.json"]
          release = release_document.get("source", release_document)
          sbom = objects["source-sbom.spdx.json"]

          checks = {
              "summary_commit": summary.get("commit") == head,
              "summary_tree": summary.get("tree") == tree,
              "summary_native_digest": summary.get("native_sanitizer_digest") == digests["source-native-sanitizer.json"],
              "summary_provenance_digest": summary.get("provenance_digest") == digests["source-provenance.json"],
              "summary_sbom_digest": summary.get("sbom_digest") == digests["source-sbom.spdx.json"],
              "summary_counts": summary.get("package_count") == len(sbom.get("packages", [])) and summary.get("file_count") == len(sbom.get("files", [])),
              "gate_source": gate.get("mode") == "source",
              "gate_passed": gate.get("passed") is True,
              "gate_missing": gate.get("missing") == [],
              "gate_17": len(gate.get("checks", {})) == 17 and all(value is True for value in gate.get("checks", {}).values()),
              "history_head": history.get("head") == head,
              "history_clean": history.get("finding_count") == 0 and history.get("findings") == [] and history.get("unscanned_blob_count") == 0 and history.get("unscanned_blobs") == [] and history.get("unused_acknowledgement_count") == 0 and history.get("unused_acknowledgements") == [],
              "history_accounting": history.get("raw_finding_count") == history.get("acknowledged_finding_count") + history.get("finding_count"),
              "native_passed": native.get("passed") is True,
              "native_android": native.get("android_lc3", {}).get("passed") is True,
              "native_ios": native.get("ios_lc3", {}).get("passed") is True,
              "native_rnnoise": native.get("rnnoise", {}).get("passed") is True,
              "native_parity": native.get("lc3_cross_platform_parity") is True and native.get("android_lc3", {}).get("pcm_digest") == native.get("ios_lc3", {}).get("pcm_digest"),
              "native_sanitizers": native.get("sanitizers") == ["address", "undefined"],
              "provenance_identity": provenance.get("repository") == REPO and provenance.get("commit") == head and provenance.get("tree") == tree,
              "provenance_crossdigests": provenance.get("history_scan_digest") == digests["source-history-scan.json"] and provenance.get("native_sanitizer_digest") == digests["source-native-sanitizer.json"] and provenance.get("sbom_digest") == digests["source-sbom.spdx.json"],
              "release_identity": release.get("commit") == head and release.get("tree") == tree,
              "release_ci": len(release.get("ci_checks", [])) == 6 and all(item.get("conclusion") == "success" for item in release.get("ci_checks", [])),
              "release_crossdigests": release.get("history_scan", {}).get("sha256") == digests["source-history-scan.json"] and release.get("native_sanitizer", {}).get("sha256") == digests["source-native-sanitizer.json"] and release.get("provenance", {}).get("sha256") == digests["source-provenance.json"] and release.get("sbom", {}).get("sha256") == digests["source-sbom.spdx.json"],
              "sbom_spdx": sbom.get("spdxVersion") == "SPDX-2.3" and sbom.get("dataLicense") == "CC0-1.0",
              "sbom_identity": sbom.get("name") == f"{REPO}@{head}" and head in sbom.get("documentNamespace", ""),
              "sbom_sha256": all(any(checksum.get("algorithm") == "SHA256" and len(checksum.get("checksumValue", "")) == 64 for checksum in file.get("checksums", [])) for file in sbom.get("files", [])),
              "no_evidence_transfer": all("evidence_transfer" not in item for item in (summary, provenance, release)),
          }
          failed = sorted(name for name, value in checks.items() if not value)
          assert not failed, failed

          body = f"""## External exact-head source packet audit — PASSED / REVIEW REQUIRED

Bound only to:

- head `{head}`
- tree `{tree}`
- canonical run `{run['id']}` / #{run['run_number']}
- Artifact `{artifact['id']}` / `{artifact['name']}`
- ZIP SHA-256 `{zip_digest}`

The canonical workflow contains exactly seven non-empty successful jobs. The downloaded Artifact has the exact safe seven-member regular-file inventory, passes CRC and strict duplicate/non-finite JSON parsing, and binds the exact commit/tree. The 17/17 source gate, complete-history accounting, LC3/RNNoise parity and sanitizers, provenance/release cross-digests, SPDX 2.3 SBOM ({len(sbom.get('packages', []))} packages / {len(sbom.get('files', []))} files), and absence of evidence transfer all passed.

This operations audit does not approve the PR and does not authenticate provider, device, firmware, KMS/HSM, attestation, signing, store or release facts. A fresh eligible non-pusher review of this exact tuple remains required. Any source/base movement invalidates this packet.
"""
          request(f"/repos/{REPO}/issues/{PR}/comments", method="POST", body={"body": body})
          try:
              request(
                  f"/repos/{REPO}/pulls/{PR}/requested_reviewers",
                  method="POST",
                  body={"reviewers": ["Franksudoman", "Tomasrgbsf"]},
              )
          except urllib.error.HTTPError as exc:
              if exc.code not in {409, 422}:
                  raise

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(body)
          print(json.dumps({
              "passed": True,
              "head": head,
              "tree": tree,
              "run_id": run["id"],
              "run_number": run["run_number"],
              "artifact_id": artifact["id"],
              "artifact_name": artifact["name"],
              "zip_sha256": zip_digest,
              "check_count": len(checks),
              "package_count": len(sbom.get("packages", [])),
              "file_count": len(sbom.get("files", [])),
          }, sort_keys=True))
          PY
