name: g8-evidence-compat

on:
  push:
    branches:
      - work/hepta-g8-evidence-compat-20260901

permissions:
  contents: write

concurrency:
  group: g8-evidence-compat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g8
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve report schema compatibility
        run: |
          test -f docs/security/HISTORY_SECRET_ACKNOWLEDGEMENTS.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/scan_git_history.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'schema_version': 2,", "'schema_version': 1,", 1)
          text = text.replace('"schema_version": 2,', '"schema_version": 1,', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild exact source evidence
        env:
          CI_REPOSITORY_CONTRACTS: success
          CI_FLUTTER: success
          CI_ANDROID_NATIVE: success
          CI_IOS_NATIVE: success
          CI_NATIVE_SANITIZERS: success
          CI_SECRET_SCAN: success
        run: |
          mkdir -p build/evidence
          python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
          tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          python3 tools/build_source_evidence.py \
            --output-dir build/evidence \
            --native-sanitizer-report build/evidence/source-native-sanitizer.json
          python3 tools/evaluate_release_gate.py \
            --bundle build/evidence/source-release-bundle.json \
            --mode source \
            --evidence-dir build/evidence \
            --output build/evidence/source-gate-result.json
          python3 tools/validate_repository.py
      - name: Commit compatibility adjustment only after full evidence pass
        run: |
          git diff --check
          git config user.name 'hepta-g8-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/scan_git_history.py
          if git diff --cached --quiet; then
            echo 'Source-evidence compatibility already verified.'
            exit 0
          fi
          git commit -m 'fix(g8): preserve source-history report schema compatibility'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g8
