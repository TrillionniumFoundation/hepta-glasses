name: hepta-final-closure-readback

on:
  push:
    branches:
      - 'ops/hepta-final-closure-readback-20260909-v1'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hepta-final-closure-readback
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Read back every source, administration and external gate
        env:
          ADMIN_TOKEN: ${{ secrets.HEPTA_REPO_ADMIN_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import stat
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import PurePosixPath
          from typing import Any

          REPO = os.environ['GH_REPOSITORY']
          CONTROL = os.environ['CONTROL_TOKEN']
          ADMIN = os.environ.get('ADMIN_TOKEN', '')
          API = 'https://api.github.com'
          PR_NUMBERS = [107, 108, 109, 110, 111, 113]
          JOBS = {
              'repository-contracts', 'flutter', 'android-native', 'ios-native',
              'native-sanitizers', 'secret-and-boundary-scan', 'source-evidence',
          }
          MEMBERS = {
              'source-evidence-summary.json', 'source-gate-result.json',
              'source-history-scan.json', 'source-native-sanitizer.json',
              'source-provenance.json', 'source-release-bundle.json',
              'source-sbom.spdx.json',
          }

          def call(path, *, token=CONTROL, method='GET', body=None, accept='application/vnd.github+json'):
              url = path if path.startswith('https://') else API + path
              payload = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method=method,
                  headers={
                      'Accept': accept,
                      'Authorization': f'Bearer {token}',
                      'User-Agent': 'hepta-final-closure-readback/1',
                      'X-GitHub-Api-Version': '2022-11-28',
                      **({'Content-Type': 'application/json'} if payload is not None else {}),
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      return response.status, response.headers, raw
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read()

          def get_json(path, *, token=CONTROL):
              status, _, raw = call(path, token=token)
              if status < 200 or status >= 300:
                  raise RuntimeError(f'GET {path} returned {status}: {raw[:500]!r}')
              return json.loads(raw)

          def strict_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON member: {key}')
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f'non-finite JSON value: {value}')

          def strict_json(raw):
              return json.loads(
                  raw.decode('utf-8'),
                  object_pairs_hook=strict_pairs,
                  parse_constant=reject_constant,
              )

          def all_threads_resolved(pr_number):
              owner, name = REPO.split('/', 1)
              query = '''
              query($owner:String!,$name:String!,$number:Int!,$cursor:String){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    reviewThreads(first:100,after:$cursor){
                      nodes{isResolved}
                      pageInfo{hasNextPage endCursor}
                    }
                  }
                }
              }
              '''
              cursor = None
              unresolved = 0
              while True:
                  status, _, raw = call(
                      'https://api.github.com/graphql',
                      method='POST',
                      body={'query': query, 'variables': {
                          'owner': owner, 'name': name,
                          'number': pr_number, 'cursor': cursor,
                      }},
                  )
                  if status != 200:
                      raise RuntimeError(f'GraphQL returned {status}')
                  document = json.loads(raw)
                  if document.get('errors'):
                      raise RuntimeError(str(document['errors']))
                  page = document['data']['repository']['pullRequest']['reviewThreads']
                  unresolved += sum(1 for node in page['nodes'] if not node['isResolved'])
                  if not page['pageInfo']['hasNextPage']:
                      return unresolved == 0, unresolved
                  cursor = page['pageInfo']['endCursor']

          def exact_run(branch, head):
              encoded = urllib.parse.quote(branch, safe='')
              runs = get_json(
                  f'/repos/{REPO}/actions/workflows/ci.yml/runs?branch={encoded}&per_page=50'
              )['workflow_runs']
              matches = [run for run in runs if run.get('head_sha') == head and run.get('event') == 'pull_request']
              if not matches:
                  return None
              return max(matches, key=lambda run: (run['run_number'], run['run_attempt']))

          def verify_artifact(run, head, tree):
              result = {
                  'present': False,
                  'two_downloads_equal': False,
                  'verified': False,
                  'artifact_id': None,
                  'zip_sha256': None,
                  'package_count': None,
                  'file_count': None,
                  'error': None,
              }
              try:
                  artifacts = get_json(
                      f"/repos/{REPO}/actions/runs/{run['id']}/artifacts?per_page=100"
                  )['artifacts']
                  name = f'hepta-source-evidence-{head}'
                  matches = [item for item in artifacts if item['name'] == name and not item['expired']]
                  if len(matches) != 1:
                      raise ValueError(f'exact Artifact count={len(matches)}')
                  artifact = matches[0]
                  result['present'] = True
                  result['artifact_id'] = artifact['id']
                  downloads = []
                  for _ in range(2):
                      status, _, raw = call(
                          f"/repos/{REPO}/actions/artifacts/{artifact['id']}/zip"
                      )
                      if status != 200:
                          raise ValueError(f'Artifact download returned {status}')
                      downloads.append(raw)
                  if downloads[0] != downloads[1]:
                      raise ValueError('two Artifact downloads differ')
                  result['two_downloads_equal'] = True
                  archive = downloads[0]
                  digest = hashlib.sha256(archive).hexdigest()
                  result['zip_sha256'] = digest
                  if artifact.get('digest') not in {None, f'sha256:{digest}'}:
                      raise ValueError('server digest differs')

                  with zipfile.ZipFile(io.BytesIO(archive)) as package:
                      infos = package.infolist()
                      names = [info.filename for info in infos]
                      if len(names) != 7 or len(set(names)) != 7 or set(names) != MEMBERS:
                          raise ValueError(f'unsafe/incomplete inventory: {names}')
                      if package.testzip() is not None:
                          raise ValueError('CRC failed')
                      raw_members = {}
                      for info in infos:
                          path = PurePosixPath(info.filename)
                          mode = (info.external_attr >> 16) & 0xFFFF
                          if (
                              path.is_absolute() or '..' in path.parts or '\\' in info.filename
                              or '\x00' in info.filename or info.is_dir()
                              or (mode != 0 and not stat.S_ISREG(mode))
                          ):
                              raise ValueError(f'unsafe member: {info.filename}')
                          raw_members[info.filename] = package.read(info)

                  objects = {name: strict_json(raw) for name, raw in raw_members.items()}
                  digests = {name: hashlib.sha256(raw).hexdigest() for name, raw in raw_members.items()}
                  summary = objects['source-evidence-summary.json']
                  gate = objects['source-gate-result.json']
                  history = objects['source-history-scan.json']
                  native = objects['source-native-sanitizer.json']
                  provenance = objects['source-provenance.json']
                  release_document = objects['source-release-bundle.json']
                  release = release_document.get('source', release_document)
                  sbom = objects['source-sbom.spdx.json']
                  checks = {
                      'summary_identity': summary.get('commit') == head and summary.get('tree') == tree,
                      'summary_crossdigests': summary.get('native_sanitizer_digest') == digests['source-native-sanitizer.json'] and summary.get('provenance_digest') == digests['source-provenance.json'] and summary.get('sbom_digest') == digests['source-sbom.spdx.json'],
                      'gate': gate.get('mode') == 'source' and gate.get('passed') is True and gate.get('missing') == [] and len(gate.get('checks', {})) == 17 and all(gate.get('checks', {}).values()),
                      'history': history.get('head') == head and history.get('finding_count') == 0 and history.get('findings') == [] and history.get('unscanned_blob_count') == 0 and history.get('unscanned_blobs') == [] and history.get('unused_acknowledgement_count') == 0 and history.get('unused_acknowledgements') == [] and history.get('raw_finding_count') == history.get('acknowledged_finding_count') + history.get('finding_count'),
                      'native': native.get('passed') is True and native.get('android_lc3', {}).get('passed') is True and native.get('ios_lc3', {}).get('passed') is True and native.get('rnnoise', {}).get('passed') is True and native.get('lc3_cross_platform_parity') is True and native.get('android_lc3', {}).get('pcm_digest') == native.get('ios_lc3', {}).get('pcm_digest') and native.get('sanitizers') == ['address', 'undefined'],
                      'provenance': provenance.get('repository') == REPO and provenance.get('commit') == head and provenance.get('tree') == tree and provenance.get('history_scan_digest') == digests['source-history-scan.json'] and provenance.get('native_sanitizer_digest') == digests['source-native-sanitizer.json'] and provenance.get('sbom_digest') == digests['source-sbom.spdx.json'],
                      'release': release.get('commit') == head and release.get('tree') == tree and len(release.get('ci_checks', [])) == 6 and all(item.get('conclusion') == 'success' for item in release.get('ci_checks', [])) and release.get('history_scan', {}).get('sha256') == digests['source-history-scan.json'] and release.get('native_sanitizer', {}).get('sha256') == digests['source-native-sanitizer.json'] and release.get('provenance', {}).get('sha256') == digests['source-provenance.json'] and release.get('sbom', {}).get('sha256') == digests['source-sbom.spdx.json'],
                      'sbom': sbom.get('spdxVersion') == 'SPDX-2.3' and sbom.get('dataLicense') == 'CC0-1.0' and sbom.get('name') == f'{REPO}@{head}' and head in sbom.get('documentNamespace', '') and all(any(checksum.get('algorithm') == 'SHA256' and len(checksum.get('checksumValue', '')) == 64 for checksum in file.get('checksums', [])) for file in sbom.get('files', [])),
                      'no_transfer': all('evidence_transfer' not in item for item in (summary, provenance, release)),
                  }
                  failed = [key for key, value in checks.items() if not value]
                  if failed:
                      raise ValueError(f'Artifact check failures: {failed}')
                  result['package_count'] = len(sbom.get('packages', []))
                  result['file_count'] = len(sbom.get('files', []))
                  result['verified'] = True
              except Exception as exc:
                  result['error'] = str(exc)
              return result

          def approval_state(pr, head, committers):
              reviews = get_json(f"/repos/{REPO}/pulls/{pr['number']}/reviews?per_page=100")
              exact = []
              for review in reviews:
                  login = (review.get('user') or {}).get('login')
                  if (
                      review.get('state') == 'APPROVED'
                      and review.get('commit_id') == head
                      and login
                      and login != (pr.get('user') or {}).get('login')
                      and login not in committers
                  ):
                      exact.append(login)
              return sorted(set(exact))

          prs = {number: get_json(f'/repos/{REPO}/pulls/{number}') for number in [101, *PR_NUMBERS, 112]}
          expected_bases = {
              107: prs[101]['head']['ref'],
              108: prs[107]['head']['ref'],
              109: prs[108]['head']['ref'],
              110: prs[109]['head']['ref'],
              111: prs[110]['head']['ref'],
              113: prs[111]['head']['ref'],
          }
          source_rows = []
          for number in PR_NUMBERS:
              pr = prs[number]
              head = pr['head']['sha']
              tree = get_json(f'/repos/{REPO}/commits/{head}')['commit']['tree']['sha']
              base_ok = pr['base']['ref'] == expected_bases[number]
              compare = get_json(f"/repos/{REPO}/compare/{pr['base']['sha']}...{head}")
              ancestry_ok = compare['status'] == 'ahead' and compare['ahead_by'] > 0
              run = exact_run(pr['head']['ref'], head)
              run_ok = False
              jobs_ok = False
              artifact = {'present': False, 'verified': False, 'error': 'no exact run'}
              if run is not None:
                  run_ok = run['status'] == 'completed' and run['conclusion'] == 'success'
                  if run_ok:
                      jobs = get_json(f"/repos/{REPO}/actions/runs/{run['id']}/jobs?per_page=100")['jobs']
                      jobs_ok = len(jobs) == 7 and {job['name'] for job in jobs} == JOBS and all(job['status'] == 'completed' and job['conclusion'] == 'success' and job.get('steps') for job in jobs)
                      if jobs_ok:
                          artifact = verify_artifact(run, head, tree)
              compare_commits = compare.get('commits', [])
              committers = set()
              for commit in compare_commits:
                  for party in (commit.get('author'), commit.get('committer')):
                      if party and party.get('login'):
                          committers.add(party['login'])
              approvals = approval_state(pr, head, committers)
              threads_ok, unresolved = all_threads_resolved(number)
              qualified = (
                  pr['state'] == 'open' and pr['draft'] is True and base_ok and ancestry_ok
                  and run_ok and jobs_ok and artifact.get('verified') is True and threads_ok
              )
              ready = qualified and bool(approvals)
              source_rows.append({
                  'pr': number,
                  'state': pr['state'],
                  'draft': pr['draft'],
                  'base': pr['base']['ref'],
                  'expected_base': expected_bases[number],
                  'head': head,
                  'tree': tree,
                  'base_ok': base_ok,
                  'ancestry_ok': ancestry_ok,
                  'run_id': run['id'] if run else None,
                  'run_number': run['run_number'] if run else None,
                  'run_status': run['status'] if run else None,
                  'run_conclusion': run['conclusion'] if run else None,
                  'jobs_ok': jobs_ok,
                  'artifact': artifact,
                  'unresolved_threads': unresolved,
                  'exact_approvers': approvals,
                  'qualified': qualified,
                  'admission_ready': ready,
              })
              if qualified and not approvals:
                  status, _, _ = call(
                      f'/repos/{REPO}/pulls/{number}/requested_reviewers',
                      method='POST',
                      body={'reviewers': ['Franksudoman', 'Tomasrgbsf']},
                  )
                  if status not in {200, 201, 409, 422}:
                      raise RuntimeError(f'reviewer request returned {status} for PR {number}')

          protection_token = ADMIN or CONTROL
          protection_status, _, protection_raw = call(
              f'/repos/{REPO}/branches/main/protection', token=protection_token
          )
          protection = {'http_status': protection_status, 'exact': False, 'failed': []}
          if protection_status == 200:
              observed = json.loads(protection_raw)
              statuses = observed.get('required_status_checks') or {}
              observed_contexts = {item['context'] for item in statuses.get('checks', [])} or set(statuses.get('contexts', []))
              reviews = observed.get('required_pull_request_reviews') or {}
              bypass = reviews.get('bypass_pull_request_allowances') or {}
              dismissal = reviews.get('dismissal_restrictions') or {}
              checks = {
                  'strict': statuses.get('strict') is True,
                  'contexts': observed_contexts == JOBS,
                  'admins': (observed.get('enforce_admins') or {}).get('enabled') is True,
                  'stale': reviews.get('dismiss_stale_reviews') is True,
                  'codeowners': reviews.get('require_code_owner_reviews') is True,
                  'approvals': reviews.get('required_approving_review_count') == 1,
                  'last_push': reviews.get('require_last_push_approval') is True,
                  'bypass_empty': all(not bypass.get(key) for key in ('users', 'teams', 'apps')),
                  'dismissal_empty': all(not dismissal.get(key) for key in ('users', 'teams', 'apps')),
                  'restrictions_none': observed.get('restrictions') is None,
                  'linear': (observed.get('required_linear_history') or {}).get('enabled') is True,
                  'no_force': (observed.get('allow_force_pushes') or {}).get('enabled') is False,
                  'no_delete': (observed.get('allow_deletions') or {}).get('enabled') is False,
                  'conversations': (observed.get('required_conversation_resolution') or {}).get('enabled') is True,
              }
              protection['checks'] = checks
              protection['failed'] = sorted(key for key, value in checks.items() if not value)
              protection['exact'] = not protection['failed']

          candidate_head = prs[101]['head']['sha']
          top_head = prs[113]['head']['sha']
          source_adoption = get_json(f'/repos/{REPO}/compare/{top_head}...{candidate_head}')
          top_adopted_to_candidate = source_adoption['status'] in {'ahead', 'identical'}
          main_head = get_json(f'/repos/{REPO}/git/ref/heads/main')['object']['sha']
          candidate_adoption = get_json(f'/repos/{REPO}/compare/{candidate_head}...{main_head}')
          candidate_adopted_to_main = candidate_adoption['status'] in {'ahead', 'identical'}

          external_files = []
          status, _, raw = call(f'/repos/{REPO}/contents/evidence/external?ref={candidate_head}')
          if status == 200:
              listing = json.loads(raw)
              external_files = sorted(
                  item['name'] for item in listing
                  if item.get('type') == 'file' and item['name'] not in {'README.md', '.gitkeep'}
              )
          closure_receipt = 'accepted-global-closure.json' in external_files
          source_all_qualified = all(row['qualified'] for row in source_rows)
          source_all_approved = all(row['admission_ready'] for row in source_rows)
          pr112_closed = prs[112]['state'] == 'closed'
          global_closed = all([
              source_all_qualified,
              source_all_approved,
              pr112_closed,
              top_adopted_to_candidate,
              prs[101]['state'] == 'closed' and prs[101].get('merged') is True,
              protection['exact'],
              candidate_adopted_to_main,
              closure_receipt,
          ])

          lines = [
              '## Final closure readback — ' + ('ALL GAPS CLOSED' if global_closed else 'OPEN GATES REMAIN'),
              '',
              '| PR | exact head | base | CI | Artifact | threads | exact approval | qualified | admission |',
              '|---:|---|---|---|---|---:|---|---|---|',
          ]
          for row in source_rows:
              artifact = row['artifact']
              lines.append(
                  f"| #{row['pr']} | `{row['head'][:12]}` | {'OK' if row['base_ok'] and row['ancestry_ok'] else 'DRIFT'} | "
                  f"{row['run_conclusion'] or row['run_status'] or 'missing'} | "
                  f"{'verified ' + str(artifact.get('artifact_id')) if artifact.get('verified') else 'missing/invalid'} | "
                  f"{row['unresolved_threads']} | {', '.join(row['exact_approvers']) or 'missing'} | "
                  f"{'yes' if row['qualified'] else 'no'} | {'ready' if row['admission_ready'] else 'blocked'} |"
              )
          lines += [
              '',
              f"- PR #112 duplicate slice closed: **{pr112_closed}**",
              f"- Complete `main` protection exact readback: **{protection['exact']}** (HTTP {protection_status}; failed={protection.get('failed', [])})",
              f"- Top source stack adopted into PR #101 candidate: **{top_adopted_to_candidate}**",
              f"- PR #101 merged: **{prs[101]['state'] == 'closed' and prs[101].get('merged') is True}**",
              f"- Candidate adopted into `main`: **{candidate_adopted_to_main}**",
              f"- External evidence files beyond README: `{external_files}`",
              f"- Independently accepted global closure receipt present: **{closure_receipt}**",
              f"- `global_closed`: **{str(global_closed).lower()}**",
              '',
              'No Draft flag, issue label, comment, synthetic trace, repository-generated key or administrator bypass is counted as provider/device/vendor/signing/release evidence.',
          ]
          body = '\n'.join(lines)
          status, _, raw = call(
              f'/repos/{REPO}/issues/82/comments',
              method='POST',
              body={'body': body},
          )
          if status not in {200, 201}:
              raise RuntimeError(f'closure comment returned {status}: {raw[:500]!r}')
          summary = {
              'global_closed': global_closed,
              'source_all_qualified': source_all_qualified,
              'source_all_approved': source_all_approved,
              'pr112_closed': pr112_closed,
              'top_adopted_to_candidate': top_adopted_to_candidate,
              'pr101_merged': prs[101]['state'] == 'closed' and prs[101].get('merged') is True,
              'main_protection_exact': protection['exact'],
              'candidate_adopted_to_main': candidate_adopted_to_main,
              'external_files': external_files,
              'closure_receipt': closure_receipt,
              'source_rows': source_rows,
              'protection': protection,
              'candidate_head': candidate_head,
              'top_head': top_head,
              'main_head': main_head,
          }
          print(json.dumps(summary, sort_keys=True))
          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as handle:
                  handle.write(body + '\n')
          PY
