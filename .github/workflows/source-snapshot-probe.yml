name: hepta-source-repair

on:
  pull_request:
    paths:
      - '.github/workflows/source-snapshot-probe.yml'

permissions:
  contents: write

concurrency:
  group: hepta-source-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable repair input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$HEAD_BRANCH" = 'work/hepta-g10-trusted-openssl-custody-20260902'
      - name: Apply bounded source repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected repair preimage: {path}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'services/control_plane/test_oauth_vault.py',
              '        self.addCleanup(self.vault.close)\n',
              '        self.addCleanup(lambda: self.vault.close())\n',
          )
          replace_once(
              'services/control_plane/test_oauth_vault.py',
              '            "https://www.googleapis.com/auth/calendar.events.owned",\n',
              '            "urn:hepta:test:calendar-owned",\n',
          )
          replace_once(
              'services/control_plane/authenticated_principals.py',
              '            or value.expires_at <= now\n            or value.expires_at > claims.expires_at\n',
              '            or value.expires_at <= now\n',
          )
          replace_once(
              'services/control_plane/oauth_vault.py',
              '                "INSERT INTO oauth_credentials VALUES(?,?,?,?,?,?,?,?, \'active\',?,?,?) "\n',
              '                "INSERT INTO oauth_credentials VALUES(?,?,?,?,?,?,?,?,?, \'active\',?,?,?) "\n',
          )
          replace_once(
              'services/skills/sandbox_runtime.py',
              '    address_space_bytes: int = 512 * 1024 * 1024\n    output_bytes: int = 1024 * 1024\n',
              '    address_space_bytes: int = 512 * 1024 * 1024\n    file_size_bytes: int = 1024 * 1024\n    output_bytes: int = 1024 * 1024\n',
          )
          replace_once(
              'services/skills/sandbox_runtime.py',
              '            or type(self.output_bytes) is not int\n',
              '            or type(self.file_size_bytes) is not int\n            or not 1 <= self.file_size_bytes <= 64 * 1024 * 1024\n            or type(self.output_bytes) is not int\n',
          )
          replace_once(
              'services/skills/sandbox_runtime.py',
              '    resource.setrlimit(resource.RLIMIT_FSIZE,(0,0))\n',
              "    resource.setrlimit(resource.RLIMIT_FSIZE,(spec['file_size_bytes'],spec['file_size_bytes']))\n",
          )
          replace_once(
              'services/skills/sandbox_runtime.py',
              '                "address_space_bytes": limits.address_space_bytes,\n                "open_files": limits.open_files,\n',
              '                "address_space_bytes": limits.address_space_bytes,\n                "file_size_bytes": limits.file_size_bytes,\n                "open_files": limits.open_files,\n',
          )
          replace_once(
              'services/skills/test_sandbox_runtime.py',
              '    def test_stderr_and_runtime_exception_do_not_leak_detail(self) -> None:\n',
              '    def test_file_size_limit_is_explicit_and_validated(self) -> None:\n        self.assert_code(\n            "skill_sandbox_limits_invalid",\n            lambda: SandboxLimits(file_size_bytes=0),\n        )\n        self.assert_code(\n            "skill_sandbox_limits_invalid",\n            lambda: SandboxLimits(file_size_bytes=64 * 1024 * 1024 + 1),\n        )\n\n    def test_stderr_and_runtime_exception_do_not_leak_detail(self) -> None:\n',
          )

          coverage_path = Path('docs/MODULE_COVERAGE.json')
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
          modules = {row['id']: row for row in coverage['module_extensions']}

          def add(module_id: str, field: str, *values: str) -> None:
              current = modules[module_id].setdefault(field, [])
              for value in values:
                  if value not in current:
                      current.append(value)

          add('identity-control-plane', 'source_roots',
              'services/control_plane/account_runtime.py')
          add('identity-control-plane', 'tests',
              'services/control_plane/test_account_runtime.py')
          add('capability-control-plane', 'source_roots',
              'services/control_plane/oauth_vault.py',
              'services/control_plane/capability_payload_store.py')
          add('capability-control-plane', 'tests',
              'services/control_plane/test_oauth_vault.py',
              'services/control_plane/test_capability_payload_store.py')
          add('memory', 'source_roots', 'services/skills/memory_service.py')
          add('memory', 'tests', 'services/skills/test_memory_service.py')
          add('skills-registry', 'source_roots',
              'services/skills/package_vault.py',
              'services/skills/sandbox_runtime.py',
              'services/skills/skill_service.py')
          add('skills-registry', 'tests',
              'services/skills/test_package_vault.py',
              'services/skills/test_sandbox_runtime.py',
              'services/skills/test_skill_service.py')
          coverage_path.write_text(
              json.dumps(coverage, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          printf '%s\n' \
            docs/MODULE_COVERAGE.json \
            services/control_plane/authenticated_principals.py \
            services/control_plane/oauth_vault.py \
            services/control_plane/test_oauth_vault.py \
            services/skills/sandbox_runtime.py \
            services/skills/test_sandbox_runtime.py | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Validate repaired source before push
        run: |
          set -euo pipefail
          python3 -c "from tools.validate_repository import validate_boundaries; validate_boundaries()"
          python3 tools/validate_source_coverage.py >/tmp/source-coverage.json
          python3 tools/validate_module_handoff.py >/tmp/module-handoff.json
          python3 -m unittest -v \
            services.control_plane.test_account_runtime \
            services.control_plane.test_oauth_vault \
            services.control_plane.test_capability_payload_store \
            services.skills.test_memory_service \
            services.skills.test_package_vault \
            services.skills.test_sandbox_runtime \
            services.skills.test_skill_service
          python3 -m compileall -q services tools
      - name: Fast-forward repaired source
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/MODULE_COVERAGE.json \
            services/control_plane/authenticated_principals.py \
            services/control_plane/oauth_vault.py \
            services/control_plane/test_oauth_vault.py \
            services/skills/sandbox_runtime.py \
            services/skills/test_sandbox_runtime.py
          git commit -m 'fix: close HG-0087 integration regressions'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
