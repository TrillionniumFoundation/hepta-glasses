name: hepta-in-package-format-probe

on:
  pull_request:
    paths:
      - '.github/workflows/source-snapshot-probe.yml'

permissions:
  contents: read

concurrency:
  group: hepta-in-package-format-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Format in package language context
        run: |
          set -euo pipefail
          dart format lib/runtime/mutation_authority.dart
          mkdir -p /tmp/hepta-format
          cp lib/runtime/mutation_authority.dart /tmp/hepta-format/mutation_authority.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-in-package-format-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/hepta-format/mutation_authority.dart
          if-no-files-found: error
          retention-days: 1
