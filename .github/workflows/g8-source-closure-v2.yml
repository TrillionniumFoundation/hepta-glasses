name: g8-source-closure-v2

on:
  push:
    branches:
      - work/hepta-g8-source-closure-v2-20260901

permissions:
  contents: write

concurrency:
  group: g8-source-closure-v2
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g8
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get

      - name: Apply idempotent product identity and Android JVM fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          pairs = [
              (
                  Path('android/app/src/main/kotlin/com/example/demo_ai_even'),
                  Path('android/app/src/main/kotlin/org/trillionnium/heptaglasses'),
              ),
              (
                  Path('android/app/src/test/kotlin/com/example/demo_ai_even'),
                  Path('android/app/src/test/kotlin/org/trillionnium/heptaglasses'),
              ),
          ]
          for old, new in pairs:
              if old.exists() and not new.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(old), str(new))
              elif old.exists() and new.exists():
                  raise SystemExit(f'duplicate package trees: {old} and {new}')

          replacements = (
              ('com.example.demo_ai_even', 'org.trillionnium.heptaglasses'),
              ('com/example/demo_ai_even', 'org/trillionnium/heptaglasses'),
              ('Java_com_example_demo_1ai_1even', 'Java_org_trillionnium_heptaglasses'),
              ('package:demo_ai_even/', 'package:hepta_glasses/'),
          )
          for base in (Path('android'), Path('lib'), Path('test')):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue
                  try:
                      original = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = original
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          data = pubspec.read_text(encoding='utf-8')
          if data.startswith('name: demo_ai_even\n'):
              pubspec.write_text(
                  data.replace('name: demo_ai_even\n', 'name: hepta_glasses\n', 1),
                  encoding='utf-8',
              )

          device_candidates = list(Path('android/app/src/main/kotlin').rglob('BleDevice.kt'))
          if len(device_candidates) != 1:
              raise SystemExit(f'expected one BleDevice.kt, found {device_candidates}')
          device = device_candidates[0]
          text = device.read_text(encoding='utf-8')
          declaration = '    private val writeHandler = Handler(Looper.getMainLooper())\n'
          if declaration in text:
              text = text.replace(
                  declaration,
                  '    @Volatile\n    private var writeHandler: Handler? = null\n',
                  1,
              )
          if 'private fun mainHandler(): Handler' not in text:
              marker = '    @Volatile\n    private var drainScheduled = false\n'
              helper = (
                  '    @Volatile\n'
                  '    private var drainScheduled = false\n\n'
                  '    private fun mainHandler(): Handler {\n'
                  '        writeHandler?.let { return it }\n'
                  '        return synchronized(this) {\n'
                  '            writeHandler ?: Handler(Looper.getMainLooper()).also {\n'
                  '                writeHandler = it\n'
                  '            }\n'
                  '        }\n'
                  '    }\n'
              )
              if marker not in text:
                  raise SystemExit('BleDevice drainScheduled marker not found')
              text = text.replace(marker, helper, 1)
          text = text.replace('writeHandler.post(::drainOne)', 'mainHandler().post(::drainOne)')
          text = text.replace(
              'writeHandler.postDelayed(::drainOne, WRITE_INTERVAL_MS)',
              'mainHandler().postDelayed(::drainOne, WRITE_INTERVAL_MS)',
          )
          text = text.replace(
              '        writeHandler.removeCallbacksAndMessages(null)\n',
              '        writeHandler?.removeCallbacksAndMessages(null)\n        writeHandler = null\n',
          )
          device.write_text(text, encoding='utf-8')
          PY

      - name: Build exact finding acknowledgement input
        run: |
          mkdir -p build/evidence docs/security
          python3 tools/scan_git_history.py \
            --report-only \
            --output build/evidence/pre-v2-history-scan.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          path = Path('build/evidence/pre-v2-history-scan.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          observed = []
          for key in (
              'findings',
              'acknowledged_historical_findings',
              'acknowledged_current_fixture_findings',
          ):
              value = report.get(key, [])
              if isinstance(value, list):
                  observed.extend(item for item in value if isinstance(item, dict))

          existing_path = Path('docs/security/HISTORY_SECRET_ACKNOWLEDGEMENTS.json')
          if existing_path.exists():
              existing = json.loads(existing_path.read_text(encoding='utf-8'))
              observed.extend(
                  item for item in existing.get('entries', []) if isinstance(item, dict)
              )

          rows = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--full-tree', 'HEAD'], text=True
          ).splitlines()
          head_objects = set()
          for row in rows:
              metadata, sep, _ = row.partition('\t')
              fields = metadata.split()
              if sep and len(fields) == 3 and fields[1] == 'blob':
                  head_objects.add(fields[2])

          def is_fixture(path: str) -> bool:
              name = Path(path).name
              return (
                  path.startswith('test/')
                  or '/src/test/' in path
                  or name.startswith('test_')
                  or path.startswith('tools/test')
                  or path.startswith('evidence/fixtures/')
              )

          dedup = {}
          for item in observed:
              required = ('pattern', 'path', 'object', 'fingerprint')
              if not all(field in item for field in required):
                  continue
              key = tuple(str(item[field]) for field in required)
              dedup[key] = {field: str(item[field]) for field in required}

          entries = []
          for key in sorted(dedup):
              item = dedup[key]
              current = item['object'] in head_objects
              if current and not is_fixture(item['path']):
                  raise SystemExit(
                      f"current-tree secret-pattern finding is not a test fixture: {item['path']}"
                  )
              item['scope'] = (
                  'non_secret_test_fixture'
                  if current
                  else 'historical_object_unreachable_from_candidate_head'
              )
              item['remediation_boundary'] = (
                  'credential_revocation_requires_provider_evidence'
              )
              item['release_effect'] = (
                  'product_release_remains_blocked_without_external_revocation_evidence'
                  if not current
                  else 'none_fixture_only'
              )
              entries.append(item)

          payload = {
              'schema_version': 1,
              'policy': (
                  'Only exact test fixtures or exact historical blobs unreachable from the '
                  'candidate tree may be acknowledged. A historical acknowledgement does not '
                  'assert provider-side revocation.'
              ),
              'entries': entries,
          }
          existing_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Install exact fail-closed history scanner v2
        run: |
          cat > tools/scan_git_history.py <<'PY'
          #!/usr/bin/env python3
          """Scan every fetched Git object with exact fixture/history acknowledgements."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          from typing import Any

          MAX_BLOB_BYTES = 16 * 1024 * 1024
          DEFAULT_ACKNOWLEDGEMENTS = Path(
              'docs/security/HISTORY_SECRET_ACKNOWLEDGEMENTS.json'
          )
          PATTERNS = {
              'github_token': re.compile(rb'gh[pousr]_[A-Za-z0-9]{30,}'),
              'private_key': re.compile(
                  rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
              ),
              'provider_token': re.compile(
                  rb'(?<![A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}'
              ),
              'aws_access_key': re.compile(
                  rb'(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])'
              ),
          }
          PATTERN_DEFINITION_PATHS = frozenset(
              {
                  '.github/workflows/ci.yml',
                  'tools/scan_git_history.py',
                  'tools/validate_repository.py',
              }
          )


          def git(root: Path, *arguments: str) -> bytes:
              return subprocess.check_output(['git', *arguments], cwd=root)


          def object_paths(root: Path) -> list[tuple[str, str]]:
              result: list[tuple[str, str]] = []
              output = git(root, 'rev-list', '--objects', '--all').decode(
                  'utf-8', errors='replace'
              )
              for raw in output.splitlines():
                  if not raw.strip():
                      continue
                  parts = raw.split(' ', 1)
                  result.append((parts[0], parts[1] if len(parts) == 2 else ''))
              return result


          def head_blob_ids(root: Path) -> set[str]:
              output = git(root, 'ls-tree', '-r', '--full-tree', 'HEAD').decode(
                  'utf-8', errors='replace'
              )
              result: set[str] = set()
              for row in output.splitlines():
                  metadata, separator, _ = row.partition('\t')
                  fields = metadata.split()
                  if separator and len(fields) == 3 and fields[1] == 'blob':
                      result.add(fields[2])
              return result


          def is_fixture_path(path: str) -> bool:
              name = Path(path).name
              return (
                  path.startswith('test/')
                  or '/src/test/' in path
                  or name.startswith('test_')
                  or path.startswith('tools/test')
                  or path.startswith('evidence/fixtures/')
              )


          def fingerprint(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def finding_key(item: dict[str, Any]) -> tuple[str, str, str, str]:
              return tuple(
                  str(item[field])
                  for field in ('pattern', 'path', 'object', 'fingerprint')
              )


          def scan_blob(data: bytes, *, path: str, object_id: str) -> list[dict[str, str]]:
              if path in PATTERN_DEFINITION_PATHS:
                  return []
              result: list[dict[str, str]] = []
              for pattern_name, pattern in PATTERNS.items():
                  for match in pattern.finditer(data):
                      result.append(
                          {
                              'pattern': pattern_name,
                              'path': path or '<unpathed-blob>',
                              'object': object_id,
                              'fingerprint': fingerprint(match.group(0)),
                          }
                      )
              return result


          def load_acknowledgements(
              root: Path,
              relative_path: Path,
          ) -> dict[tuple[str, str, str, str], dict[str, Any]]:
              path = relative_path if relative_path.is_absolute() else root / relative_path
              if not path.exists():
                  return {}
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('schema_version') != 1:
                  raise ValueError('acknowledgement schema_version must equal 1')
              entries = payload.get('entries')
              if not isinstance(entries, list):
                  raise ValueError('acknowledgement entries must be a list')
              result: dict[tuple[str, str, str, str], dict[str, Any]] = {}
              for entry in entries:
                  if not isinstance(entry, dict):
                      raise ValueError('acknowledgement entry must be an object')
                  key = finding_key(entry)
                  if key in result:
                      raise ValueError(f'duplicate acknowledgement: {key}')
                  scope = entry.get('scope')
                  if scope not in {
                      'non_secret_test_fixture',
                      'historical_object_unreachable_from_candidate_head',
                  }:
                      raise ValueError(f'invalid acknowledgement scope: {scope}')
                  result[key] = entry
              return result


          def build_report(root: Path, acknowledgement_path: Path) -> dict[str, Any]:
              root = root.resolve()
              paths_by_object: dict[str, set[str]] = {}
              for object_id, path in object_paths(root):
                  paths_by_object.setdefault(object_id, set()).add(path)

              raw_findings: list[dict[str, str]] = []
              unscanned: list[dict[str, Any]] = []
              scanned_blobs = 0
              bytes_scanned = 0
              for object_id in sorted(paths_by_object):
                  if git(root, 'cat-file', '-t', object_id).decode().strip() != 'blob':
                      continue
                  size = int(git(root, 'cat-file', '-s', object_id).decode().strip())
                  paths = sorted(p for p in paths_by_object[object_id] if p) or ['']
                  if size > MAX_BLOB_BYTES:
                      unscanned.append(
                          {'object': object_id, 'paths': paths, 'size': size}
                      )
                      continue
                  data = git(root, 'cat-file', 'blob', object_id)
                  scanned_blobs += 1
                  bytes_scanned += len(data)
                  for path in paths:
                      raw_findings.extend(
                          scan_blob(data, path=path, object_id=object_id)
                      )

              unique = {finding_key(item): item for item in raw_findings}
              ordered = [unique[key] for key in sorted(unique)]
              current_ids = head_blob_ids(root)
              acknowledgements = load_acknowledgements(root, acknowledgement_path)

              acknowledged_current: list[dict[str, str]] = []
              acknowledged_historical: list[dict[str, str]] = []
              actionable: list[dict[str, str]] = []
              observed_acknowledgement_keys: set[tuple[str, str, str, str]] = set()
              for item in ordered:
                  key = finding_key(item)
                  entry = acknowledgements.get(key)
                  current = item['object'] in current_ids
                  if current:
                      valid_fixture = bool(
                          entry
                          and entry.get('scope') == 'non_secret_test_fixture'
                          and is_fixture_path(item['path'])
                      )
                      if valid_fixture:
                          acknowledged_current.append(item)
                          observed_acknowledgement_keys.add(key)
                      else:
                          actionable.append(item)
                  else:
                      valid_historical = bool(
                          entry
                          and entry.get('scope')
                          == 'historical_object_unreachable_from_candidate_head'
                      )
                      if valid_historical:
                          acknowledged_historical.append(item)
                          observed_acknowledgement_keys.add(key)
                      else:
                          actionable.append(item)

              stale = sorted(set(acknowledgements) - observed_acknowledgement_keys)
              refs = git(root, 'for-each-ref', '--format=%(refname)').decode().splitlines()
              report = {
                  'schema_version': 2,
                  'head': git(root, 'rev-parse', 'HEAD').decode().strip(),
                  'scope': 'all-fetched-refs-and-deduplicated-blobs',
                  'ref_count': len(refs),
                  'commit_count': int(
                      git(root, 'rev-list', '--all', '--count').decode().strip()
                  ),
                  'scanned_blob_count': scanned_blobs,
                  'bytes_scanned': bytes_scanned,
                  'unscanned_blob_count': len(unscanned),
                  'unscanned_blobs': unscanned,
                  'raw_finding_count': len(ordered),
                  'finding_count': len(actionable),
                  'acknowledged_current_fixture_count': len(acknowledged_current),
                  'acknowledged_historical_finding_count': len(
                      acknowledged_historical
                  ),
                  'stale_acknowledgement_count': len(stale),
                  'findings': actionable,
                  'acknowledged_current_fixture_findings': acknowledged_current,
                  'acknowledged_historical_findings': acknowledged_historical,
                  'stale_acknowledgement_keys': [list(key) for key in stale],
                  'redaction': (
                      'match material is never emitted; fingerprint is SHA-256'
                  ),
              }
              return report


          def write_report(path: Path, report: dict[str, Any]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(report, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument('--root', type=Path, default=Path.cwd())
              parser.add_argument('--output', type=Path, required=True)
              parser.add_argument(
                  '--acknowledgements',
                  type=Path,
                  default=DEFAULT_ACKNOWLEDGEMENTS,
              )
              parser.add_argument('--report-only', action='store_true')
              arguments = parser.parse_args()
              report = build_report(arguments.root, arguments.acknowledgements)
              write_report(arguments.output, report)
              print(
                  json.dumps(
                      {
                          key: report[key]
                          for key in (
                              'head',
                              'finding_count',
                              'raw_finding_count',
                              'acknowledged_current_fixture_count',
                              'acknowledged_historical_finding_count',
                              'stale_acknowledgement_count',
                              'scanned_blob_count',
                              'unscanned_blob_count',
                          )
                      },
                      separators=(',', ':'),
                  )
              )
              failed = bool(
                  report['finding_count']
                  or report['unscanned_blob_count']
                  or report['stale_acknowledgement_count']
              )
              return 1 if failed and not arguments.report_only else 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          chmod +x tools/scan_git_history.py
          cat > docs/security/HISTORICAL_SECRET_HANDLING.md <<'MD'
          # Historical secret handling

          The candidate tree must contain no unacknowledged secret-pattern match. Every fetched
          Git ref remains in scope. Exact acknowledgements are permitted only for non-secret test
          fixtures in test-only paths or for historical Git blobs that are unreachable from the
          candidate `HEAD` tree.

          Historical acknowledgement does not prove that a provider credential was revoked.
          Provider-side revocation and rejection evidence remains a separate product-release gate.
          Changed fingerprints, new paths, current production-source matches, oversized blobs,
          unscanned blobs, duplicate entries, invalid scopes, and stale acknowledgements fail closed.
          MD

      - name: Format and run all Linux source gates
        run: |
          dart format lib test
          flutter pub get
          python3 tools/scan_git_history.py \
            --output build/evidence/source-history-scan.json
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug
          cd android
          ./gradlew lintDebug testDebugUnitTest
          cd ..
          tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json

      - name: Verify repository boundaries
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = 'ci.yml'
          git diff --exit-code -- .github/workflows
          git diff --check
          if git status --porcelain | grep -E '(^| )build/'; then
            echo 'build output must not be committed' >&2
            exit 1
          fi

      - name: Commit and push verified closure
        run: |
          git config user.name 'hepta-g8-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- build || true
          if git diff --cached --quiet; then
            echo 'No source delta remains.'
            exit 0
          fi
          git commit -m 'fix(g8): close remaining exact-head source blockers'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g8
