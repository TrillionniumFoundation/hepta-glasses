name: hepta-archive-tests-materialize-v1

on:
  push:
    branches:
      - 'ops/hepta-archive-tests-materialize-20260909-v1'

permissions:
  contents: write

concurrency:
  group: hepta-archive-tests-materialize-v1
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'f0970362607ff2451a6c3aa8a9411614d57db098'
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable source and target lease
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='f0970362607ff2451a6c3aa8a9411614d57db098'
          TARGET='codex/hepta-terminal-convergence-20260909'
          test "$(git rev-parse HEAD)" = "$SOURCE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE"
          test -z "$(git status --porcelain)"
      - name: Materialize and run reviewed hostile archive tests
        shell: bash
        env:
          PAYLOAD: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ['PAYLOAD'], validate=True))
          if len(data) != 22967:
              raise SystemExit(f'payload_size_mismatch:{len(data)}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != '9b7d4d39ab1247405974e192678b0ba27d240fd0fbc1c12316a46a7a31a437a0':
              raise SystemExit(f'payload_digest_mismatch:{digest}')
          Path('services/qualification/test_source_artifact_archive_receipt.py').write_bytes(data)
          PY
          test "$(git status --porcelain)" = '?? services/qualification/test_source_artifact_archive_receipt.py'
          python3 -m py_compile \
            tools/verify_source_archive_receipt.py \
            services/qualification/test_source_artifact_archive_receipt.py
          PYTHONPATH=. python3 -m unittest -v \
            services.qualification.test_source_artifact_archive_receipt
      - name: Commit and lease-protected push
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='f0970362607ff2451a6c3aa8a9411614d57db098'
          TARGET='codex/hepta-terminal-convergence-20260909'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- services/qualification/test_source_artifact_archive_receipt.py
          git commit -m 'test: cover durable source Artifact archive trust boundaries'
          git push origin \
            --force-with-lease="refs/heads/$TARGET:$SOURCE" \
            "HEAD:refs/heads/$TARGET"
