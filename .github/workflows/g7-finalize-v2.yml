name: g7-finalize-v2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hepta-glasses-g7-synthesis
    paths:
      - .github/workflows/g7-finalize-v2.yml
      - tools/apply_g7_finalize_v2.py
      - tools/g7-finalize-v2.trigger

permissions:
  contents: write

concurrency:
  group: g7-final-mutator
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-g7-synthesis
          fetch-depth: 0
          persist-credentials: true
      - name: Configure bounded finalization identity
        run: |
          git config user.name 'hepta-g7-final-v2[bot]'
          git config user.email 'hepta-g7-final-v2[bot]@users.noreply.github.com'
      - name: Apply all source-hardening waves and remove mutators
        run: python3 tools/apply_g7_finalize_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Normalize exact candidate
        run: |
          flutter pub get
          dart format lib test
          git add -A
          git diff --cached --check
      - name: Run repository, Python, Flutter, native, and Android gates
        run: |
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test
          bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          if [ -x tools/run_native_sanitizer_tests.sh ]; then
            bash tools/run_native_sanitizer_tests.sh
          fi
          python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
          flutter build apk --debug
          (cd android && ./gradlew testDebugUnitTest)
      - name: Refuse stale write
        run: |
          git fetch origin codex/hepta-glasses-g7-synthesis
          REMOTE_SHA="$(git rev-parse origin/codex/hepta-glasses-g7-synthesis)"
          START_SHA="$(git rev-parse HEAD)"
          test "$REMOTE_SHA" = "$START_SHA"
      - name: Commit final validated source candidate
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No final changes.'
            exit 0
          fi
          git commit -m 'fix(g7): publish final validated source candidate'
          git push origin HEAD:codex/hepta-glasses-g7-synthesis
