name: hepta-glasses-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: hepta-glasses-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 tools/validate_repository.py
      - run: python3 -m unittest discover -s services -p 'test_*.py'
      - run: python3 -m unittest discover -s adapters -p 'test_*.py'
      - run: python3 -m compileall -q services adapters tools

  flutter:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Enforce formatting for authority-bound runtime changes
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/runtime/contracts.dart
          lib/runtime/policy_engine.dart
          test/runtime/policy_engine_test.dart
          test/runtime/tool_gateway_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  secret-and-boundary-scan:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - run: |
          set -euo pipefail
          ! grep -RInE '(DASHSCOPE_API_KEY|DEEPSEEK_API_KEY|OPENAI_API_KEY|api\.deepseek\.com|dashscope\.aliyuncs\.com|api\.openai\.com)' lib android ios services adapters plugins
          ! grep -RInE '(dangerously-bypass-approvals-and-sandbox|--yolo|danger-full-access)' services plugins adapters lib
          ! grep -RInE --exclude-dir=.git -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}' lib android ios services adapters plugins evidence

  source-evidence:
    runs-on: ubuntu-latest
    needs:
      - repository-contracts
      - flutter
      - secret-and-boundary-scan
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exact-head SBOM and provenance
        env:
          CI_REPOSITORY_CONTRACTS: ${{ needs.repository-contracts.result }}
          CI_FLUTTER: ${{ needs.flutter.result }}
          CI_SECRET_SCAN: ${{ needs.secret-and-boundary-scan.result }}
        run: python3 tools/build_source_evidence.py --output-dir build/evidence
      - name: Verify artifact is bound to PR head
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('build/evidence/source-evidence-summary.json').read_text())
          expected = os.environ['SOURCE_HEAD_SHA']
          if summary['commit'] != expected:
              raise SystemExit(
                  f"source evidence commit {summary['commit']} != expected head {expected}"
              )
          PY
      - name: Evaluate source release gate
        run: |
          python3 tools/evaluate_release_gate.py \
            --bundle build/evidence/source-release-bundle.json \
            --mode source \
            --output build/evidence/source-gate-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-source-evidence-${{ env.SOURCE_HEAD_SHA }}
          path: build/evidence
          if-no-files-found: error
          retention-days: 30
