name: hepta-governance-owner-expansion-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-governance-owner-expansion-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity and governance-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          actual="$(git diff --name-only "$BASE_SHA" "$SOURCE_HEAD_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/CODEOWNERS' '.github/workflows/ci.yml' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Validate owner expansion and read-only workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          owners = Path('.github/CODEOWNERS').read_text(encoding='utf-8')
          effective = [
              line.strip() for line in owners.splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          if effective != ['* @ProfHepta @Tomasrgbsf']:
              raise SystemExit(f'unexpected CODEOWNERS policy: {effective!r}')

          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          required = [
              'permissions:\n  contents: read',
              'repository-contracts:',
              'flutter:',
              'secret-and-boundary-scan:',
              'source-evidence:',
              'persist-credentials: false',
              'claim_ceiling',
              'governance_codeowner_expansion_only',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'governance workflow contract missing: {missing!r}')

          forbidden = [
              'contents:' + r'\s*' + 'write',
              'pull-requests:' + r'\s*' + 'write',
              'issues:' + r'\s*' + 'write',
              'git' + r'\s+' + 'push',
              'update' + '-ref',
              'create' + 'CommitOnBranch',
              'persist-' + 'credentials: true',
          ]
          for pattern in forbidden:
              if re.search(pattern, workflow, flags=re.IGNORECASE):
                  raise SystemExit(f'write-capable governance workflow: {pattern}')
      - name: Prove qualification is read-only
        run: git diff --exit-code

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Prove owner expansion has no product or platform impact
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$SOURCE_HEAD_SHA")"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(lib/|test/|android/|ios/|pubspec\.yaml$|pubspec\.lock$|analysis_options\.yaml$)'; then
            echo 'owner expansion unexpectedly changes product or platform source' >&2
            exit 1
          fi
          actual="$(printf '%s\n' "$changed" | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/CODEOWNERS' '.github/workflows/ci.yml' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Prove qualification is read-only
        run: git diff --exit-code

  secret-and-boundary-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Scan exact governance delta
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          base = '${{ github.event.pull_request.base.sha }}'
          head = '${{ github.event.pull_request.head.sha }}'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines()
          expected = ['.github/CODEOWNERS', '.github/workflows/ci.yml']
          if sorted(changed) != sorted(expected):
              raise SystemExit(f'unexpected changed paths: {changed!r}')

          patterns = [
              ('private-key', re.compile(
                  '-----' + 'BEGIN ' + '(?:RSA |EC |OPENSSH )?' + 'PRIVATE KEY' + '-----'
              )),
              ('github-token', re.compile('gh' + '[pousr]_' + '[A-Za-z0-9]{30,}')),
              ('secret-assignment', re.compile(
                  r'(?i)(password|secret|token|api[_-]?key)\s*[:=]\s*["\'][^"\']{12,}["\']'
              )),
          ]
          for relative in changed:
              text = Path(relative).read_text(encoding='utf-8')
              for label, pattern in patterns:
                  if pattern.search(text):
                      raise SystemExit(f'{label} material found in {relative}')

          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden_literals = [
              'contents: ' + 'write',
              'persist-' + 'credentials: true',
              'git' + ' push',
              'update' + '-ref',
          ]
          for literal in forbidden_literals:
              if literal.lower() in workflow.lower():
                  raise SystemExit(f'write authority detected: {literal}')
      - name: Prove qualification is read-only
        run: git diff --exit-code

  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - repository-contracts
      - flutter
      - secret-and-boundary-scan
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CI_REPOSITORY_CONTRACTS: ${{ needs.repository-contracts.result }}
      CI_FLUTTER: ${{ needs.flutter.result }}
      CI_SECRET_SCAN: ${{ needs.secret-and-boundary-scan.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Build content-addressed owner-expansion evidence
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          base = os.environ['BASE_SHA']
          changed = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines())
          expected = sorted(['.github/CODEOWNERS', '.github/workflows/ci.yml'])
          if head != os.environ['SOURCE_HEAD_SHA'] or changed != expected:
              raise SystemExit('owner-expansion evidence identity or scope mismatch')

          files = {}
          for relative in changed:
              data = Path(relative).read_bytes()
              files[relative] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          prerequisites = {
              'repository-contracts': os.environ['CI_REPOSITORY_CONTRACTS'],
              'flutter': os.environ['CI_FLUTTER'],
              'secret-and-boundary-scan': os.environ['CI_SECRET_SCAN'],
          }
          if set(prerequisites.values()) != {'success'}:
              raise SystemExit(f'prerequisite result mismatch: {prerequisites!r}')

          evidence = {
              'schema_version': 1,
              'claim_ceiling': 'governance_codeowner_expansion_only',
              'repository': '${{ github.repository }}',
              'pull_request': ${{ github.event.pull_request.number }},
              'base': base,
              'head': head,
              'tree': tree,
              'changed_files': changed,
              'files': files,
              'effective_codeowners': ['ProfHepta', 'Tomasrgbsf'],
              'beneficiary_must_not_self_approve': True,
              'prerequisites': prerequisites,
              'passed': True,
              'missing': [],
              'non_claims': [
                  'product source qualification',
                  'production deployment',
                  'provider or device evidence',
                  'main branch protection readback',
                  'release authority',
              ],
          }
          output = Path('build/governance-evidence')
          output.mkdir(parents=True, exist_ok=True)
          encoded = json.dumps(
              evidence, ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ).encode('utf-8') + b'\n'
          (output / 'governance-codeowner-expansion.json').write_bytes(encoded)
          (output / 'governance-codeowner-expansion.sha256').write_text(
              hashlib.sha256(encoded).hexdigest()
              + '  governance-codeowner-expansion.json\n',
              encoding='utf-8',
          )
      - name: Verify evidence bytes and claim ceiling
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json

          root = Path('build/governance-evidence')
          data = (root / 'governance-codeowner-expansion.json').read_bytes()
          document = json.loads(data)
          if document.get('claim_ceiling') != 'governance_codeowner_expansion_only':
              raise SystemExit('invalid owner-expansion evidence claim ceiling')
          if document.get('passed') is not True or document.get('missing') != []:
              raise SystemExit('owner-expansion evidence did not pass')
          if document.get('effective_codeowners') != ['ProfHepta', 'Tomasrgbsf']:
              raise SystemExit('owner-expansion evidence owner set mismatch')
          recorded = (
              root / 'governance-codeowner-expansion.sha256'
          ).read_text().split()[0]
          if hashlib.sha256(data).hexdigest() != recorded:
              raise SystemExit('owner-expansion evidence digest mismatch')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-governance-codeowner-expansion-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/governance-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Prove qualification is read-only
        run: git diff --exit-code
