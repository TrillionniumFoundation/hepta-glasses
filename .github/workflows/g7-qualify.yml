name: g7-exact-head-qualification

on:
  push:
    branches:
      - codex/hepta-glasses-g7-synthesis
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: g7-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOURCE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Validate repository and reference services
        run: |
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
      - name: Validate Flutter runtime and UI
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test
      - name: Validate vendored native code and history
        run: |
          bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          if [ -x tools/run_native_sanitizer_tests.sh ]; then
            bash tools/run_native_sanitizer_tests.sh
          fi
          python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
      - name: Validate Android build and native tests
        run: |
          flutter build apk --debug
          cd android
          ./gradlew testDebugUnitTest
      - name: Prove checks are read-only
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g7-linux-source-${{ github.sha }}
          path: build/evidence
          if-no-files-found: error
          retention-days: 30

  ios-native:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      SOURCE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Install locked CocoaPods dependencies
        run: |
          cd ios
          pod install --deployment
      - run: flutter build ios --simulator --debug
      - name: Run iOS native tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in sorted(devices, reverse=True) for device in devices[runtime] if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Prove checks are read-only
        run: git diff --exit-code

  source-evidence:
    needs:
      - source-and-android
      - ios-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate exact-head reports
        run: |
          bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
      - name: Build exact-head SBOM, provenance, and source bundle
        env:
          CI_REPOSITORY_CONTRACTS: success
          CI_FLUTTER: success
          CI_ANDROID_NATIVE: success
          CI_IOS_NATIVE: success
          CI_NATIVE_SANITIZERS: success
          CI_SECRET_SCAN: success
        run: |
          python3 tools/build_source_evidence.py \
            --output-dir build/evidence \
            --native-sanitizer-report build/evidence/source-native-sanitizer.json
          python3 tools/evaluate_release_gate.py \
            --bundle build/evidence/source-release-bundle.json \
            --mode source \
            --evidence-dir build/evidence \
            --output build/evidence/source-gate-result.json
      - name: Verify exact-head evidence binding
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          expected = os.environ['SOURCE_HEAD_SHA']
          summary = json.loads(
              Path('build/evidence/source-evidence-summary.json').read_text()
          )
          gate = json.loads(
              Path('build/evidence/source-gate-result.json').read_text()
          )
          if summary['commit'] != expected:
              raise SystemExit('source evidence is not bound to exact head')
          if not gate.get('passed') or gate.get('missing'):
              raise SystemExit(f"source gate failed: {gate}")
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-g7-source-evidence-${{ github.sha }}
          path: build/evidence
          if-no-files-found: error
          retention-days: 30

  promote-for-independent-review:
    needs:
      - source-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
      HEAD_BRANCH: codex/hepta-glasses-g7-synthesis
    steps:
      - name: Refuse promotion if branch head moved
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$REMOTE_SHA" = "$HEAD_SHA"
      - name: Mark exact-head PR ready and request independent reviewers
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          gh api \
            --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=ProfHepta' \
            -f 'reviewers[]=Franksudoman'
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "G7 exact-head source qualification passed for \`${HEAD_SHA}\`. The source evidence artifact is \`hepta-g7-source-evidence-${HEAD_SHA}\`. This is E0-E4 source evidence only; independent review and all E5-E7 product gates remain mandatory. No merge was performed."
