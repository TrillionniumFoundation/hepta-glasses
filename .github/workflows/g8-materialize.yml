name: g8-materialize

on:
  push:
    branches:
      - work/hepta-glasses-gap-closure-g8-materialize

permissions:
  contents: write

concurrency:
  group: g8-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/hepta-glasses-gap-closure-g8-materialize
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the exact reviewed patch
        run: |
          set -euo pipefail
          test -f .github/g8-fix.patch.gz.b64
          base64 --decode .github/g8-fix.patch.gz.b64 | gzip -dc > /tmp/g8-fix.patch
          git apply --check /tmp/g8-fix.patch
          git apply /tmp/g8-fix.patch
          rm .github/g8-fix.patch.gz.b64
          rm .github/workflows/g8-materialize.yml
          git diff --check
      - name: Verify source contracts before committing
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          find services adapters tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit the self-cleaning materialization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -s -m 'fix(g8): close exact-head CI blockers'
          git push origin HEAD:work/hepta-glasses-gap-closure-g8-materialize
