name: g8-materialize

on:
  push:
    branches:
      - work/hepta-glasses-gap-closure-g8-materialize

permissions:
  contents: write

concurrency:
  group: g8-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/hepta-glasses-gap-closure-g8-materialize
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply staged exact-source repair
        run: |
          set -euo pipefail
          base64 --decode .github/g8-fix-v2.patch.gz.b64 | gunzip > /tmp/g8-fix.patch
          git apply --check /tmp/g8-fix.patch
          git apply /tmp/g8-fix.patch
          rm -f \
            .github/g8-fix.patch.gz.b64 \
            .github/g8-fix-v2.patch.gz.b64 \
            .github/workflows/g8-materialize.yml
      - name: Normalize and verify source
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug
          (cd android && ./gradlew testDebugUnitTest)
      - name: Commit verified materialization and self-delete
        run: |
          set -euo pipefail
          git config user.name 'hepta-g8-materializer[bot]'
          git config user.email 'hepta-g8-materializer[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -s -m 'fix(g8): close exact-head CI blockers'
          git push origin HEAD:work/hepta-glasses-gap-closure-g8-materialize
