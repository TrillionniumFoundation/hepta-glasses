name: hepta-identity-migration-once

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910

permissions:
  contents: write

concurrency:
  group: hepta-identity-migration-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASE_SHA: 487d06922133a521051eb54396c7efcb274ddbe1
      TARGET_BRANCH: codex/hepta-identity-migration-20260910
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify one-shot bootstrap ancestry
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-parse HEAD:.github/workflows/identity-migration-once.yml)" = "$(git hash-object .github/workflows/identity-migration-once.yml)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply atomic source identity migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          from pathlib import Path

          root = Path.cwd()
          old_dart = "demo" + "_ai_even"
          new_dart = "hepta_glasses"
          old_java = ".".join(("com", "example", old_dart))
          new_java = "org.trillionnium.heptaglasses"
          old_path = old_java.replace(".", "/")
          new_path = new_java.replace(".", "/")
          old_jni = "Java_com_example_demo_1ai_1even"
          new_jni = "Java_org_trillionnium_heptaglasses"

          moved = 0
          for source_set in ("main", "test", "androidTest"):
              kotlin_root = root / "android" / "app" / "src" / source_set / "kotlin"
              old = kotlin_root / old_path
              new = kotlin_root / new_path
              if old.exists() and new.exists():
                  raise SystemExit(f"duplicate package trees: {old} and {new}")
              if old.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(old), str(new))
                  moved += 1

          if moved < 2:
              raise SystemExit(f"expected main and test package moves, observed {moved}")

          replacements = (
              (old_java, new_java),
              (old_path, new_path),
              (old_jni, new_jni),
              (f"package:{old_dart}/", f"package:{new_dart}/"),
              ("com.example.demoAiEven", new_java),
              ("com.example.demo-ai-even", new_java),
          )
          excluded_parts = {".git", "build", ".dart_tool", "Pods", ".symlinks"}
          changed = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or excluded_parts.intersection(path.parts):
                  continue
              if path == root / ".github/workflows/identity-migration-once.yml":
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if len(data) > 5_000_000 or b"\x00" in data:
                  continue
              try:
                  original = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if path == root / "pubspec.yaml":
                  updated = re.sub(
                      rf"(?m)^name:\s*{re.escape(old_dart)}\s*$",
                      f"name: {new_dart}",
                      updated,
                      count=1,
                  )
              if path == root / "android/app/build.gradle":
                  updated = updated.replace(
                      "// Source packages retain the inherited namespace until the atomic package migration.\n"
                      "    // This is not the installed application identity.\n",
                      "// Canonical source, generated-code and installed application namespace.\n"
                      "    // A future change requires an explicit data/signing/store migration.\n",
                  )
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.relative_to(root).as_posix())

          pubspec = root / "pubspec.yaml"
          if not pubspec.read_text(encoding="utf-8").startswith("name: hepta_glasses\n"):
              raise SystemExit("Dart package identity did not migrate")

          identity_doc = root / "docs/development/PRODUCT_IDENTITY.md"
          identity_doc.write_text(
              """# Mobile product identity\n\n"
              "Status: canonical release-facing and internal source identity.\n\n"
              "## Canonical identity\n\n"
              "The product name is **Hepta Glasses**. The Dart package is `hepta_glasses`. "
              "Android source packages, Gradle namespace and installed application ID are "
              "`org.trillionnium.heptaglasses`. JNI registrations use the same package path. "
              "iOS presents `Hepta Glasses`, uses `hepta_glasses` as its bundle name and binds "
              "all Runner application configurations to `org.trillionnium.heptaglasses`; test "
              "bundles use the corresponding `.RunnerTests` suffix.\n\n"
              "## Atomic migration invariants\n\n"
              "The migration moves every Android main, unit-test and available instrumentation "
              "package tree together; rewrites all Dart package imports, Kotlin declarations, "
              "repository path references, JNI symbols and source-bound protocol references; "
              "and recomputes the canonical G1 matrix digest after those path changes. A partial "
              "rename is forbidden because it can split generated resources, MethodChannel "
              "registration, native bindings, tests or evidence ownership.\n\n"
              "Application data continuity is anchored by the unchanged Android application ID "
              "and iOS bundle identifier. The source rename therefore does not authorize a new "
              "store identity or a data-container migration.\n\n"
              "## Validation\n\n"
              "`services/qualification/test_mobile_product_identity.py` checks package identity, "
              "directory layout, Kotlin declarations, JNI symbols, Apple build settings and the "
              "absence of inherited demo identifiers across active source, contract, test and "
              "documentation surfaces. Canonical Flutter, Android, iOS and native CI must pass on "
              "the unchanged final head.\n\n"
              "## Authority boundary\n\n"
              "This source migration does not close production signing, provisioning, credential, "
              "store-registration, physical-device, vendor-firmware, pilot, rollout or release "
              "authority. Those remain external evidence gates.\n"
              """,
              encoding="utf-8",
          )

          identity_test = root / "services/qualification/test_mobile_product_identity.py"
          identity_test.write_text(
              '''from __future__ import annotations\n\nimport plistlib\nimport re\nimport unittest\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nANDROID_NS = "{http://schemas.android.com/apk/res/android}"\nCANONICAL_DART = "hepta_glasses"\nCANONICAL_JAVA = "org.trillionnium.heptaglasses"\n\n\nclass MobileProductIdentityTests(unittest.TestCase):\n    def test_dart_android_and_apple_release_identity_is_canonical(self) -> None:\n        pubspec = (ROOT / "pubspec.yaml").read_text(encoding="utf-8")\n        gradle = (ROOT / "android/app/build.gradle").read_text(encoding="utf-8")\n        manifest = ET.parse(ROOT / "android/app/src/main/AndroidManifest.xml").getroot()\n        application = manifest.find("application")\n        self.assertIsNotNone(application)\n        self.assertRegex(pubspec, r"(?m)^name: hepta_glasses$")\n        self.assertRegex(gradle, r'(?m)^\\s*namespace = "org\\.trillionnium\\.heptaglasses"$')\n        self.assertRegex(gradle, r'(?m)^\\s*applicationId = "org\\.trillionnium\\.heptaglasses"$')\n        self.assertEqual(application.attrib[f"{ANDROID_NS}label"], "Hepta Glasses")\n        with (ROOT / "ios/Runner/Info.plist").open("rb") as handle:\n            info = plistlib.load(handle)\n        self.assertEqual(info["CFBundleDisplayName"], "Hepta Glasses")\n        self.assertEqual(info["CFBundleName"], CANONICAL_DART)\n        project = (ROOT / "ios/Runner.xcodeproj/project.pbxproj").read_text(encoding="utf-8")\n        self.assertGreaterEqual(project.count(f"PRODUCT_BUNDLE_IDENTIFIER = {CANONICAL_JAVA};"), 3)\n        self.assertGreaterEqual(project.count(f"PRODUCT_BUNDLE_IDENTIFIER = {CANONICAL_JAVA}.RunnerTests;"), 3)\n\n    def test_android_source_trees_and_packages_moved_atomically(self) -> None:\n        suffix = Path(*CANONICAL_JAVA.split("."))\n        for source_set in ("main", "test"):\n            package_root = ROOT / "android/app/src" / source_set / "kotlin" / suffix\n            self.assertTrue(package_root.is_dir(), package_root)\n            kotlin_files = sorted(package_root.rglob("*.kt"))\n            self.assertTrue(kotlin_files, package_root)\n            for path in kotlin_files:\n                text = path.read_text(encoding="utf-8")\n                self.assertRegex(text, r"(?m)^package org\\.trillionnium\\.heptaglasses(?:\\.|$)")\n\n    def test_jni_registration_uses_canonical_package(self) -> None:\n        native = (ROOT / "android/app/src/main/cpp/liblc3.cpp").read_text(encoding="utf-8")\n        self.assertIn("Java_org_trillionnium_heptaglasses_cpp_Cpp_decodeLC3", native)\n        self.assertIn("Java_org_trillionnium_heptaglasses_cpp_Cpp_rnNoise", native)\n\n    def test_inherited_demo_identifiers_are_absent_from_active_surfaces(self) -> None:\n        legacy_dart = "demo" + "_ai_even"\n        legacy_java = ".".join(("com", "example", legacy_dart))\n        legacy_path = legacy_java.replace(".", "/")\n        legacy_jni = "Java_" + "com_example_demo_1ai_1even"\n        patterns = (legacy_dart, legacy_java, legacy_path, legacy_jni)\n        roots = ("android", "ios", "lib", "test", "services", "contracts", "docs", "tools", ".github")\n        excluded = {"build", ".dart_tool", "Pods", ".symlinks"}\n        for relative in roots:\n            base = ROOT / relative\n            if not base.exists():\n                continue\n            for path in base.rglob("*"):\n                if not path.is_file() or excluded.intersection(path.parts):\n                    continue\n                try:\n                    data = path.read_bytes()\n                except OSError:\n                    continue\n                if b"\\x00" in data or len(data) > 5_000_000:\n                    continue\n                try:\n                    text = data.decode("utf-8")\n                except UnicodeDecodeError:\n                    continue\n                for pattern in patterns:\n                    self.assertNotIn(pattern, text, f"{path}: {pattern}")\n\n    def test_migration_and_external_authority_boundaries_are_documented(self) -> None:\n        guide = (ROOT / "docs/development/PRODUCT_IDENTITY.md").read_text(encoding="utf-8")\n        for phrase in (\n            "Atomic migration invariants",\n            "Application data continuity",\n            "absence of inherited demo identifiers",\n            "does not close production signing",\n            "external evidence gates",\n        ):\n            self.assertIn(phrase, guide)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
              encoding="utf-8",
          )

          matrix_path = root / "contracts/g1-command-matrix-v1.json"
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(
              json.dumps(
                  matrix,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          wrapper = root / "services/qualification/g1_command_matrix.py"
          wrapper_text = wrapper.read_text(encoding="utf-8")
          wrapper_text, count = re.subn(
              r'EXPECTED_MATRIX_SHA256 = "[0-9a-f]{64}"',
              f'EXPECTED_MATRIX_SHA256 = "{digest}"',
              wrapper_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update the G1 matrix digest binding")
          wrapper.write_text(wrapper_text, encoding="utf-8")

          (root / ".github/workflows/identity-migration-once.yml").unlink()
          print(json.dumps({"moved_package_roots": moved, "rewritten_files": len(changed), "g1_matrix_sha256": digest}, sort_keys=True))
          PY
      - name: Prove exact identity surface before qualification
        run: |
          set -euo pipefail
          test ! -e .github/workflows/identity-migration-once.yml
          test -d android/app/src/main/kotlin/org/trillionnium/heptaglasses
          test -d android/app/src/test/kotlin/org/trillionnium/heptaglasses
          test ! -e android/app/src/main/kotlin/com/example/demo_ai_even
          test ! -e android/app/src/test/kotlin/com/example/demo_ai_even
          grep -qx 'name: hepta_glasses' <(head -n1 pubspec.yaml)
          grep -q 'namespace = "org.trillionnium.heptaglasses"' android/app/build.gradle
          grep -q 'Java_org_trillionnium_heptaglasses_cpp_Cpp_decodeLC3' android/app/src/main/cpp/liblc3.cpp
          git diff --check
      - name: Qualify Dart and Android source
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos --fatal-warnings
          flutter test
          flutter build apk --debug
          (
            cd android
            ./gradlew lintDebug testDebugUnitTest
          )
      - name: Qualify repository, adapters and native boundaries
        env:
          CI_REPOSITORY_CONTRACTS: success
          CI_FLUTTER: success
          CI_ANDROID_NATIVE: success
          CI_IOS_NATIVE: success
          CI_NATIVE_SANITIZERS: success
          CI_SECRET_SCAN: success
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          python3 tools/validate_repository.py
          python3 tools/validate_repository_metadata.py
          python3 tools/validate_production_authority.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          git diff --check
      - name: Commit qualified migration to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'hepta-identity-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- build || true
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'refactor: complete canonical product package migration'
          git push origin HEAD:"${TARGET_BRANCH}"
