name: hepta-pr111-rebase-after-pr110

on:
  push:
    branches:
      - 'ops/hepta-pr110-format-20260909-v1'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: hepta-pr111-rebase-after-pr110
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the same-head PR 110 audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OPS_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          head = os.environ["OPS_HEAD"]
          path = urllib.parse.quote("hepta_pr110_exact_head_audit.yml", safe="")
          url = f"https://api.github.com/repos/{repository}/actions/workflows/{path}/runs?branch=ops/hepta-pr110-format-20260909-v1&per_page=20"
          deadline = time.monotonic() + 22 * 60
          while time.monotonic() < deadline:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "hepta-pr111-rebase-gate/1",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.loads(response.read())["workflow_runs"]
              matches = [run for run in runs if run.get("head_sha") == head]
              if matches:
                  run = max(matches, key=lambda item: item["run_attempt"])
                  if run["status"] == "completed":
                      if run["conclusion"] != "success":
                          raise SystemExit(
                              f"same-head PR 110 audit failed: {run['html_url']}"
                          )
                      print(json.dumps({"audit_run": run["id"], "conclusion": "success"}))
                      break
              time.sleep(20)
          else:
              raise SystemExit("timed out waiting for the same-head PR 110 audit")
          PY
      - name: Linearly rebase PR 111 and write a success sentinel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GH_REPOSITORY"
          old_base='d4efdc4be3213cc2170ddd99334d508b7c5d2ccb'
          target_branch='codex/hepta-critical-test-depth-20260908'
          version_branch='codex/hepta-version-authority-20260908'
          sentinel='docs/development/VERSION_AUTHORITY_REBASE_READY'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${repository}.git"

          git clone --filter=blob:none "$remote" repository
          cd repository
          git fetch origin \
            "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}" \
            "refs/heads/${version_branch}:refs/remotes/origin/${version_branch}"
          target_head="$(git rev-parse "origin/${target_branch}")"
          old_head="$(git rev-parse "origin/${version_branch}")"
          git merge-base --is-ancestor "$old_base" "$target_head"
          git merge-base --is-ancestor "$old_base" "$old_head"
          test -z "$(git rev-list --merges "${old_base}..${old_head}")"
          test "$(git rev-list --count "${old_base}..${old_head}")" -gt 0

          git checkout -B version-work "origin/${version_branch}"
          git rebase --onto "$target_head" "$old_base" version-work
          test "$(git rev-list --count "${target_head}..HEAD")" -gt 0
          test -z "$(git rev-list --merges "${target_head}..HEAD")"
          mkdir -p "$(dirname "$sentinel")"
          : > "$sentinel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$sentinel"
          git commit -m 'chore: bind version authority stack to qualified critical-depth parent'
          new_head="$(git rev-parse HEAD)"
          git push origin \
            --force-with-lease="refs/heads/${version_branch}:${old_head}" \
            "HEAD:refs/heads/${version_branch}"

          python3 - "$repository" "$new_head" "$target_head" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repository, new_head, target_head = sys.argv[1:]
          token = os.environ["GH_TOKEN"]
          body = {
              "base": "codex/hepta-critical-test-depth-20260908",
              "title": "[DRAFT / REQUALIFYING] semantic version authority on qualified critical-depth parent",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/pulls/111",
              data=json.dumps(body).encode(),
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "hepta-pr111-rebase/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          comment = {
              "body": (
                  "## Stack rebuilt after exact-head source audit\n\n"
                  f"PR #111 was linearly replayed on PR #110 head `{target_head}` and now points to `{new_head}`. "
                  "The empty `VERSION_AUTHORITY_REBASE_READY` sentinel exists only so a connector-authored source update can trigger canonical PR CI. "
                  "No CI, Artifact, review or prospective-merge evidence transfers from the former head."
              )
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/111/comments",
              data=json.dumps(comment).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "hepta-pr111-rebase/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          PY
