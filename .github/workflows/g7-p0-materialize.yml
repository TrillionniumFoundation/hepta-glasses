name: g7-p0-materialize

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g7-p0-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g7
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply source convergence when still pending
        run: |
          if test -f tools/apply_g7_p0_convergence.py; then
            python3 tools/apply_g7_p0_convergence.py
          fi
      - run: flutter pub get
      - run: dart format lib test
      - run: python3 -m compileall -q services adapters tools
      - name: Remove one-shot materializer
        run: rm -f .github/workflows/g7-p0-materialize.yml .github/workflows/g7-p0-converge.yml tools/apply_g7_p0_convergence.py
      - name: Commit formatted candidate
        run: |
          set -euo pipefail
          git config user.name 'hepta-g7-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(g7): materialize source convergence candidate'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g7
