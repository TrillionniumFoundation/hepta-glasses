name: g8-authoritative-cleanup-v2

on:
  push:
    branches:
      - work/hepta-g8-authoritative-cleanup-v2-20260901
    paths:
      - .github/workflows/g8-authoritative-cleanup-v2.yml

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate authoritative PASS and remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          candidate = 'codex/hepta-glasses-gap-closure-g8'
          status_branch = 'work/hepta-g8-authoritative-final-v2-20260901'
          status_path = 'status/g8-authoritative-final-v2.json'
          expected_jobs = {
              'repository-contracts',
              'flutter',
              'android-native',
              'ios-native',
              'native-sanitizers',
              'secret-and-boundary-scan',
              'source-evidence',
          }

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          status = None
          for _ in range(90):
              try:
                  encoded_ref = urllib.parse.quote(status_branch, safe='')
                  value = request(
                      'GET',
                      f'/repos/{repository}/contents/{status_path}?ref={encoded_ref}',
                  )
                  status = json.loads(
                      base64.b64decode(value['content']).decode('utf-8')
                  )
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              time.sleep(10)
          if status is None:
              raise SystemExit('Authoritative v2 status was not available; cleanup forbidden')

          candidate_record = request(
              'GET',
              f'/repos/{repository}/branches/{urllib.parse.quote(candidate, safe="")}',
          )
          current_head = candidate_record['commit']['sha']
          bound_head = status.get('pull_request', {}).get('head_sha')
          gate = status.get('gates', {}).get('repository_actionable')
          head_changed = status.get('pull_request', {}).get(
              'head_changed_after_dispatch'
          )
          jobs = status.get('formal_ci', {}).get('jobs', {})
          matrix_success = (
              set(jobs) == expected_jobs
              and all(value == 'success' for value in jobs.values())
          )
          artifact_count = status.get('source_evidence', {}).get(
              'matching_artifact_count'
          )

          if current_head != bound_head:
              raise SystemExit(
                  f'Candidate head {current_head} does not match bound head {bound_head}'
              )
          if gate != 'PASS' or head_changed is not False:
              raise SystemExit(
                  f'Authoritative gate is not a stable PASS: gate={gate}, '
                  f'head_changed={head_changed}'
              )
          if not matrix_success or artifact_count != 1:
              raise SystemExit(
                  f'Formal matrix/artifact contract failed: jobs={jobs}, '
                  f'artifact_count={artifact_count}'
              )

          branches = [
              'work/hepta-g8-pass1-20260901',
              'work/hepta-g8-source-closure-20260901',
              'work/hepta-g8-source-closure-v2-20260901',
              'work/hepta-g8-finalizer-20260901',
              'work/hepta-g8-evidence-compat-20260901',
              'work/hepta-g8-identity-final-20260901',
              'work/hepta-g8-ci-orchestrator-20260901',
              'work/hepta-g8-gap-sync-20260901',
              'work/hepta-g8-final-bind-20260901',
              'work/hepta-g8-cleanup-20260901',
              'work/hepta-g8-status-snapshot-20260901',
              'work/hepta-g8-status-final-20260901',
              'work/hepta-glasses-gap-closure-g8-diagnostics',
              'work/hepta-glasses-gap-closure-g7-staging',
          ]
          deleted = []
          absent = []
          for branch in branches:
              encoded_ref = urllib.parse.quote(f'heads/{branch}', safe='/')
              try:
                  request('DELETE', f'/repos/{repository}/git/refs/{encoded_ref}')
                  deleted.append(branch)
              except urllib.error.HTTPError as error:
                  if error.code in (404, 422):
                      absent.append(branch)
                  else:
                      raise

          marker = '<!-- hepta-g8-authoritative-cleanup-v2 -->'
          body = '\n'.join([
              marker,
              '## Authoritative G8 temporary-branch cleanup v2',
              '',
              f'- Bound candidate head: `{bound_head}`',
              f"- Formal run: `{status.get('formal_ci', {}).get('run_id')}`",
              f'- Repository-actionable gate: `{gate}`',
              f'- Deleted temporary branches: `{len(deleted)}`',
              f'- Already absent: `{len(absent)}`',
              '',
              'The canonical candidate, authoritative v2 status branch, historical audit refs, and external-evidence issues were preserved. Cleanup did not approve, merge, sign, deploy, or release.',
          ])
          comments = request(
              'GET', f'/repos/{repository}/issues/23/comments?per_page=100'
          )
          existing = next(
              (item for item in comments if marker in (item.get('body') or '')),
              None,
          )
          if existing:
              request(
                  'PATCH',
                  f"/repos/{repository}/issues/comments/{existing['id']}",
                  {'body': body},
              )
          else:
              request(
                  'POST',
                  f'/repos/{repository}/issues/23/comments',
                  {'body': body},
              )

          own_ref = urllib.parse.quote(
              'heads/work/hepta-g8-authoritative-cleanup-v2-20260901',
              safe='/',
          )
          request('DELETE', f'/repos/{repository}/git/refs/{own_ref}')
          PY
