name: hepta-convergence-materialize

on:
  push:
    branches:
      - 'ops/hepta-convergence-format-20260909-v1'

permissions:
  contents: write

concurrency:
  group: hepta-convergence-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'e2d8914ccff72489fc5c85e8539f06c0b41af8e8'
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source and target lease
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='e2d8914ccff72489fc5c85e8539f06c0b41af8e8'
          TARGET='codex/hepta-terminal-convergence-20260909-v1'
          test "$(git rev-parse HEAD)" = "$SOURCE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE"
      - name: Materialize reviewed convergence payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64
          import hashlib
          import io
          import lzma
          import tarfile
          from pathlib import Path, PurePosixPath

          payload = """"""
          compressed = base64.b64decode(payload, validate=True)
          expected = "de40c9aa7a34a4d2edf91b6bbaa89bc9e5925945d43d08dcfacf5d9c82cc6dca"
          if hashlib.sha256(compressed).hexdigest() != expected:
              raise SystemExit("convergence payload digest mismatch")
          archive = lzma.decompress(compressed, format=lzma.FORMAT_XZ)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as bundle:
              members = bundle.getmembers()
              if len(members) != 40:
                  raise SystemExit("unexpected convergence payload member count")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or not member.isfile() or any(
                      part in {"", ".", ".."} for part in path.parts
                  ):
                      raise SystemExit(f"unsafe convergence payload member: {member.name}")
              bundle.extractall(Path.cwd())
          PYCODE
      - name: Import reviewed source Artifact archival slice without stray files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_SOURCE='95915336c3c6ffe34823ed402bced94b6fb6b15c'
          git fetch --no-tags origin "$ARCHIVE_SOURCE"
          paths=(
            docs/development/SOURCE_ARTIFACT_ARCHIVAL.md
            evidence/templates/source-artifact-archive-receipt.template.json
            schemas/source-artifact-archive-receipt.schema.json
            services/qualification/test_source_artifact_archive_receipt.py
            tools/verify_source_archive_receipt.py
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$ARCHIVE_SOURCE:$path" > "$path"
          done
          test ! -e tmp-test.txt
      - name: Validate atomic convergence tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          python3 tools/validate_source_coverage.py
          python3 tools/validate_module_handoff.py
          python3 -m unittest \
            services.qualification.test_module_handoff \
            services.qualification.test_module_semantic_handoff \
            services.qualification.test_release_versioning \
            services.qualification.test_external_gap_execution \
            services.qualification.test_source_artifact_archive_receipt
          python3 -m compileall -q services tools
      - name: Commit and lease-protected push to convergence branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='e2d8914ccff72489fc5c85e8539f06c0b41af8e8'
          TARGET='codex/hepta-terminal-convergence-20260909-v1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: converge module handoff, versioning and evidence execution'
          new_head="$(git rev-parse HEAD)"
          printf 'new_head=%s\n' "$new_head"
          git push origin \
            --force-with-lease="refs/heads/$TARGET:$SOURCE" \
            "HEAD:refs/heads/$TARGET"
