name: g7-mobile-materialize

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g7-mobile-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g7
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: python3 tools/apply_g7_mobile_closure.py
      - run: flutter pub get
      - run: dart format lib test
      - run: python3 -m compileall -q services adapters tools
      - name: Commit mobile candidate
        run: |
          set -euo pipefail
          git config user.name 'hepta-g7-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(g7): close mobile and device-runtime blockers'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g7
