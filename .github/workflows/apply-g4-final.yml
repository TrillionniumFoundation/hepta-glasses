name: hepta-g4-documentation-applier

on:
  push:
    branches:
      - codex/hepta-glasses-source-closure-g4

permissions:
  contents: write

concurrency:
  group: hepta-g4-documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-g4-docs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply canonical G4 documents and gates
        run: |
          python3 - <<'PYCODE'
          import base64
          import zlib
          from pathlib import Path

          payload_path = Path('tools/g4_docs_payload.txt')
          encoded = payload_path.read_text(encoding='ascii').strip()
          source = zlib.decompress(
              base64.b64decode(encoded, validate=True)
          ).decode('utf-8')
          source = source.replace('    Path(__file__).unlink()\n', '', 1)
          source = source.replace(
              '"dependencies {\\n    implementation \'org.jetbrains.kotlin:kotlin-reflect:1.9.23\'\\n}\\n",',
              '"dependencies {\\n    implementation \'org.jetbrains.kotlin:kotlin-reflect:1.9.23\'\\n}",',
              1,
          )
          namespace = {
              '__name__': '__main__',
              '__file__': str(Path('tools/apply_g4_docs.py').resolve()),
          }
          exec(compile(source, namespace['__file__'], 'exec'), namespace)
          payload_path.unlink()
          PYCODE
      - name: Normalize and validate canonical state
        run: |
          flutter pub get
          dart format lib test
          python3 tools/validate_repository.py
          python3 -m compileall -q services adapters tools
          git diff --check
      - name: Commit canonical G4 state
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Workflow mutations are committed separately by the trusted GitHub
          # connector; the ephemeral GITHUB_TOKEN cannot widen workflow authority.
          git restore --source=HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "No canonical changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(g4): bind canonical plan, ledger, evidence, and native tests [normalize-g4]"
          git push origin "HEAD:${TARGET_BRANCH}"
