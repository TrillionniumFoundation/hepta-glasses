name: hepta-final-source-closure-once

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910
    paths:
      - .github/workflows/current-successor-truth-once.yml
      - tools/one_shot_current_successor_truth_repair.py

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: hepta-final-source-closure-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  close-repository-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact bounded controller object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor \
            300e2abdbe1f4939125af87eaa0958e8bd44b12b HEAD
          actual="$(git diff --name-only \
            300e2abdbe1f4939125af87eaa0958e8bd44b12b HEAD \
            | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-successor-truth-once.yml' \
            'tools/one_shot_current_successor_truth_repair.py' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply the bounded final source-closure transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/one_shot_current_successor_truth_repair.py')
          text = path.read_text(encoding='utf-8')
          old = 'base64.b85decode(_PAYLOAD)'
          new = "base64.b85decode(b''.join(_PAYLOAD.split()))"
          if text.count(old) != 1:
              raise SystemExit('compressed controller transport shape drifted')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 tools/one_shot_current_successor_truth_repair.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          workflow_path = Path('.github/workflows/ci.yml')
          policy_path = Path('tools/native/dependency_update_policy.py')
          test_path = Path('services/qualification/test_dependency_automation.py')

          workflow = workflow_path.read_bytes()
          approved = hashlib.sha1(
              f'blob {len(workflow)}\0'.encode('ascii') + workflow
          ).hexdigest()
          policy = policy_path.read_text(encoding='utf-8')
          if policy.count(approved) != 1:
              raise SystemExit('dependency policy is not bound to final workflow blob')

          test = test_path.read_text(encoding='utf-8')
          old = '526ff56e187c5ec2d2093fe9616c4978fed776f0'
          if test.count(old) != 1:
              raise SystemExit('dependency automation workflow fixture drifted')
          test_path.write_text(test.replace(old, approved), encoding='utf-8')
          PY
      - name: Remove temporary execution authority from the final tree
        run: |
          git rm -f \
            .github/workflows/current-successor-truth-once.yml \
            tools/one_shot_current_successor_truth.py \
            tools/one_shot_current_successor_truth_repair.py
      - name: Resolve dependencies and commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if flutter pub get; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'flutter pub get failed after bounded retries' >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          dart format --output=write lib test
      - name: Validate repository, current truth and source boundaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')" = "1"
          test -f .github/workflows/ci.yml
          python3 tools/validate_repository.py
          python3 tools/validate_repository_metadata.py
          python3 tools/validate_production_authority.py
          python3 tools/native/dependency_update_policy.py --check-dependabot-contract
          python3 services/qualification/documentation_truth.py --verify-github
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
      - name: Validate Flutter and Android source behavior
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug
          (cd android && ./gradlew testDebugUnitTest)
      - name: Commit and package the carrier-free candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test ! -e .github/workflows/current-successor-truth-once.yml
          test ! -e tools/one_shot_current_successor_truth.py
          test ! -e tools/one_shot_current_successor_truth_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close final repository source blockers'
          mkdir -p build/final-source-closure
          git branch -f final-source-closure-artifact HEAD
          git bundle create \
            build/final-source-closure/final-source-closure.bundle \
            final-source-closure-artifact
          git format-patch --binary --stdout \
            "${{ github.sha }}"..HEAD \
            > build/final-source-closure/final-source-closure.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          root = Path('build/final-source-closure')
          changed = git('diff-tree', '--no-commit-id', '--name-status', '-r', 'HEAD').splitlines()
          files = {}
          for line in changed:
              status, path = line.split('\t', 1)
              item = {'status': status}
              if status != 'D':
                  raw = Path(path).read_bytes()
                  item.update({
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'git_blob_sha1': git('rev-parse', f'HEAD:{path}'),
                  })
              files[path] = item
          manifest = {
              'schema_version': 1,
              'controller_head': '${{ github.sha }}',
              'commit': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'),
              'parent': git('rev-parse', 'HEAD^'),
              'message': git('log', '-1', '--format=%B'),
              'files': files,
          }
          encoded = json.dumps(
              manifest,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8') + b'\n'
          (root / 'manifest.json').write_bytes(encoded)
          (root / 'manifest.sha256').write_text(
              hashlib.sha256(encoded).hexdigest() + '  manifest.json\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-final-source-closure-${{ github.sha }}
          path: build/final-source-closure
          if-no-files-found: error
          retention-days: 30
