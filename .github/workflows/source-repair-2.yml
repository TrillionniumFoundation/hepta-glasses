name: hepta-source-repair-2

on:
  pull_request:
    paths:
      - '.github/workflows/source-repair-2.yml'

permissions:
  contents: write

concurrency:
  group: hepta-source-repair-2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable repair input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$HEAD_BRANCH" = 'work/hepta-g10-trusted-openssl-custody-20260902'
      - name: Repair principal and seccomp regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected repair preimage: {path}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'services/control_plane/test_authenticated_principals.py',
              '            replace(self.pair, expires_at=self.now),\n            replace(self.pair, expires_at=1300),\n',
              '            replace(self.pair, expires_at=self.now),\n',
          )
          replace_once(
              'services/control_plane/test_authenticated_principals.py',
              '    def test_unknown_or_crossed_audience_scope_is_rejected_before_access(self) -> None:\n',
              '    def test_long_lived_pair_is_capped_by_short_lived_access(self) -> None:\n        self.pairs.binding = replace(self.pair, expires_at=1300)\n        principal = self.adapter.verify(\n            bearer_token="account-token-123456789",\n            audience=MUTATION_AUDIENCE,\n            required_scope=MUTATION_SCOPE,\n        )\n        self.assertIsInstance(principal, MutationPrincipal)\n        self.assertEqual(principal.expires_at, self.claims.expires_at)\n\n    def test_unknown_or_crossed_audience_scope_is_rejected_before_access(self) -> None:\n',
          )
          replace_once(
              'services/skills/test_sandbox_runtime.py',
              '        result = self.execute(\n            "import errno,json,os,socket\\n"\n            "codes={}\\n"\n            "try: socket.socket()\\n"\n            "except OSError as e: codes[\'socket\']=e.errno\\n"\n            "try: os.fork()\\n"\n            "except OSError as e: codes[\'fork\']=e.errno\\n"\n            "print(json.dumps(codes,sort_keys=True,separators=(\',\',\':\')))\\n"\n        )\n',
              '        result = self.execute(\n            "import ctypes,json\\n"\n            "libc=ctypes.CDLL(None,use_errno=True)\\n"\n            "def denied(number,*args):\\n"\n            " ctypes.set_errno(0)\\n"\n            " value=libc.syscall(number,*args)\\n"\n            " return ctypes.get_errno() if value == -1 else 0\\n"\n            "codes={\'socket\':denied(41,2,1,0),\'fork\':denied(57)}\\n"\n            "print(json.dumps(codes,sort_keys=True,separators=(\',\',\':\')))\\n"\n        )\n',
          )
          PY
          printf '%s\n' \
            services/control_plane/test_authenticated_principals.py \
            services/skills/test_sandbox_runtime.py | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - name: Validate repaired contracts
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            services.control_plane.test_authenticated_principals \
            services.control_plane.test_account_runtime \
            services.skills.test_sandbox_runtime \
            services.skills.test_skill_service
          python3 -m compileall -q services
      - name: Fast-forward repaired source
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/control_plane/test_authenticated_principals.py \
            services/skills/test_sandbox_runtime.py
          git commit -m 'test: align rotating identity and seccomp regressions'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
