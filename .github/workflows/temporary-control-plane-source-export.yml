name: Temporary control-plane source export

on:
  push:
    branches:
      - codex/hepta-glasses-ai-native-foundation-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Export selected public source files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-control-plane-source-${{ github.sha }}
          path: |
            services/control_plane/identity.py
            services/control_plane/test_identity.py
          if-no-files-found: error
          retention-days: 1
