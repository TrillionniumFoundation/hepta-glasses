name: g8-source-materialize

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g8-source-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g8
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply fail-closed G8 convergence
        run: python3 tools/apply_g8_source_closure.py
      - run: flutter pub get
      - name: Commit canonical formatting
        run: dart format lib test
      - run: python3 tools/validate_repository.py
      - run: python3 -m unittest discover -s services -p 'test_*.py'
      - run: python3 -m unittest discover -s adapters -p 'test_*.py'
      - run: python3 -m compileall -q services adapters tools
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
      - run: git diff --check
      - name: Commit verified G8 source candidate
        run: |
          set -euo pipefail
          git config user.name 'hepta-g8-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(g8): close remaining repository-actionable blockers'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g8
