name: hepta-admin-closure-v8

on:
  push:
    branches:
      - ops/hepta-admin-closure-20260908-v8

permissions:
  contents: read

concurrency:
  group: hepta-admin-closure-v8
  cancel-in-progress: false

jobs:
  apply-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEPTA_REPO_ADMIN_TOKEN: ${{ secrets.HEPTA_REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated operations source
        shell: bash
        run: |
          set -euo pipefail
          candidate=35f01329262d6a137bfa3c7e95302a397ed32676
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "$candidate" HEAD
          test "$(git diff --name-only "$candidate" HEAD)" = ".github/workflows/hepta-admin-closure-v8.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply canonical protection and verify readback
        id: governance
        shell: bash
        run: |
          set -u
          mkdir -p build/governance-v8
          if test -n "${HEPTA_REPO_ADMIN_TOKEN:-}"; then
            secret_present=true
          else
            secret_present=false
          fi

          set +e
          python3 tools/repository_governance.py --apply \
            >build/governance-v8/apply.stdout \
            2>build/governance-v8/apply.stderr
          apply_rc=$?
          verify_rc=99
          if test "$apply_rc" -eq 0; then
            python3 tools/repository_governance.py \
              >build/governance-v8/verify.stdout \
              2>build/governance-v8/verify.stderr
            verify_rc=$?
          fi
          set -e

          SECRET_PRESENT="$secret_present" APPLY_RC="$apply_rc" VERIFY_RC="$verify_rc" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('build/governance-v8')

          def parsed_stdout(name: str):
              path = root / name
              if not path.exists():
                  return None
              data = path.read_bytes()
              try:
                  value = json.loads(data.decode('utf-8'))
              except Exception:
                  return {
                      'parseable': False,
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'bytes': len(data),
                  }
              return {'parseable': True, 'value': value}

          def private_diagnostic(name: str):
              path = root / name
              if not path.exists():
                  return None
              data = path.read_bytes()
              return {
                  'present': bool(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'bytes': len(data),
              }

          report = {
              'schema_version': 1,
              'repository': 'TrillionniumFoundation/hepta-glasses',
              'target_branch': 'main',
              'approved_candidate': '35f01329262d6a137bfa3c7e95302a397ed32676',
              'workflow_commit': os.environ['GITHUB_SHA'],
              'admin_secret_present': os.environ['SECRET_PRESENT'] == 'true',
              'apply_return_code': int(os.environ['APPLY_RC']),
              'verify_return_code': int(os.environ['VERIFY_RC']),
              'apply_result': parsed_stdout('apply.stdout'),
              'verify_result': parsed_stdout('verify.stdout'),
              'apply_private_diagnostic': private_diagnostic('apply.stderr'),
              'verify_private_diagnostic': private_diagnostic('verify.stderr'),
              'token_value_recorded': False,
              'candidate_or_main_ref_modified_by_workflow_source': False,
          }
          (root / 'execution.json').write_text(
              json.dumps(report, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          for name in ('apply.stdout', 'apply.stderr', 'verify.stdout', 'verify.stderr'):
              path = root / name
              if path.exists():
                  path.unlink()
          PY

          overall_rc="$apply_rc"
          if test "$apply_rc" -eq 0; then
            overall_rc="$verify_rc"
          fi
          echo "overall_rc=$overall_rc" >> "$GITHUB_OUTPUT"
          exit "$overall_rc"
      - name: Upload sanitized governance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-admin-closure-v8-${{ github.sha }}
          path: build/governance-v8/execution.json
          if-no-files-found: error
          retention-days: 30
