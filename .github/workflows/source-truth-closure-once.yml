name: hepta-source-truth-closure-once

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910

permissions:
  contents: write

concurrency:
  group: hepta-source-truth-closure-once
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BASE_SHA: d483c1f31cf08f0eb437637fa7619613f50137a9
      TARGET_BRANCH: codex/hepta-identity-migration-20260910
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify bounded temporary scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          actual="$(git diff --name-only "$SOURCE_BASE_SHA" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/source-truth-closure-once.yml' 'tools/one_shot_source_truth.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply deterministic CI and module semantics closure
        run: python3 tools/one_shot_source_truth.py
      - name: Validate deterministic repository truth
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native/dependency_update_policy.py --check-dependabot-contract
          python3 tools/native/dependency_update_policy.py --check-cocoapods
          python3 tools/generate_module_docs.py --check
          python3 tools/validate_module_semantics.py
          python3 tools/validate_repository.py
          python3 tools/validate_repository_metadata.py
          python3 tools/validate_production_authority.py
          python3 -m unittest services.qualification.test_dependabot_config_custody -v
          python3 -m unittest services.qualification.test_dependency_automation -v
          python3 -m unittest services.qualification.test_module_semantic_docs -v
          python3 -m compileall -q services adapters tools
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          git diff --check
          test ! -e .github/workflows/source-truth-closure-once.yml
          test ! -e tools/one_shot_source_truth.py
      - name: Publish tested source successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-source-closure-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no source changes produced' >&2; exit 1; }
          git commit -m 'quality: make CI deterministic and bind eleven documentation dimensions'
          git push origin "HEAD:${TARGET_BRANCH}"
