name: hepta-pr110-format-transport

on:
  push:
    branches:
      - 'ops/hepta-pr110-format-20260909-v1'

permissions:
  contents: write

concurrency:
  group: hepta-pr110-format-transport
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: '3745ec55d771e94bc1326ba1e8cf5c235e3173ae'
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable source and target lease
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='3745ec55d771e94bc1326ba1e8cf5c235e3173ae'
          TARGET='codex/hepta-critical-test-depth-20260908'
          test "$(git rev-parse HEAD)" = "$SOURCE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE"
      - uses: subosito/flutter-action@1a4493c4d6fe3ab7a2d32c1a2cd2ac0a093f6ddf
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format exact audited file set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            lib/runtime/mutation_authority_http.dart
            lib/runtime/strict_json.dart
            test/runtime/mutation_authority_http_test.dart
            test/runtime/packet_codec_contract_support.dart
            test/runtime/packet_codec_generated_support.dart
            test/runtime/packet_codec_test.dart
            test/runtime/strict_json_test.dart
          )
          dart format "${expected[@]}"
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT -- '*.dart' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --check
          dart format --output=none --set-exit-if-changed "${expected[@]}"
      - name: Commit and lease-protected push to the draft branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='3745ec55d771e94bc1326ba1e8cf5c235e3173ae'
          TARGET='codex/hepta-critical-test-depth-20260908'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/runtime/mutation_authority_http.dart \
            lib/runtime/strict_json.dart \
            test/runtime/mutation_authority_http_test.dart \
            test/runtime/packet_codec_contract_support.dart \
            test/runtime/packet_codec_generated_support.dart \
            test/runtime/packet_codec_test.dart \
            test/runtime/strict_json_test.dart
          git commit -m 'style: apply Dart formatter to critical-depth slice'
          formatted_head="$(git rev-parse HEAD)"
          printf 'formatted_head=%s\n' "$formatted_head"
          git push origin \
            --force-with-lease="refs/heads/$TARGET:$SOURCE" \
            "HEAD:refs/heads/$TARGET"
