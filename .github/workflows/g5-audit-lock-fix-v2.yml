name: g5-audit-lock-structural-fix

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5

permissions:
  contents: write

concurrency:
  group: hepta-g5-final-fixes
  cancel-in-progress: false

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Structurally replace instance queue with a path-keyed queue
        run: |
          python3 - <<'PYCODE'
          import re
          from pathlib import Path

          path = Path('lib/runtime/audit_journal.dart')
          text = path.read_text()
          if '_pathTails' not in text:
              text, count = re.subn(
                  r'^  Future<void> _tail = Future<void>\.value\(\);$',
                  "  static final Map<String, Future<void>> _pathTails =\n"
                  "      <String, Future<void>>{};\n\n"
                  "  String get _pathLockKey => lockFileFor(file).absolute.path;",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit('instance queue field was not found exactly')
          replacement = '''  Future<T> _exclusive<T>(Future<T> Function() operation) {
            final completer = Completer<T>();
            final key = _pathLockKey;
            final previous = _pathTails[key] ?? Future<void>.value();
            final scheduled = previous.then((_) async {
              try {
                completer.complete(await _withFileLock(operation));
              } on Object catch (error, stackTrace) {
                completer.completeError(error, stackTrace);
              }
            });
            _pathTails[key] = scheduled;
            unawaited(scheduled.whenComplete(() {
              if (identical(_pathTails[key], scheduled)) {
                _pathTails.remove(key);
              }
            }));
            return completer.future;
          }

          Future<T> _withFileLock'''
          text, count = re.subn(
              r'  Future<T> _exclusive<T>\(Future<T> Function\(\) operation\) \{.*?\n  \}\n\n  Future<T> _withFileLock',
              replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('exclusive method was not found exactly')
          if re.search(r'\b_tail\b', text):
              raise SystemExit('legacy instance queue reference remains')
          if text.count('_pathTails') < 4:
              raise SystemExit('path-keyed queue is incomplete')
          path.write_text(text)

          audit_test = Path('test/runtime/audit_journal_test.dart')
          test_text = audit_test.read_text().replace(
              "'0' * 64", "List<String>.filled(64, '0').join()"
          )
          audit_test.write_text(test_text)
          PYCODE
      - name: Run strict Dart and audit concurrency gates
        run: |
          flutter pub get
          dart format lib/runtime/audit_journal.dart test/runtime/audit_journal_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/runtime/audit_journal_test.dart
          flutter test
      - name: Commit tested structural fix and remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/g5-audit-lock-fix.yml \
            .github/workflows/g5-audit-lock-fix-v2.yml \
            .github/workflows/g5-finalize.yml \
            .github/workflows/g5-remediate.yml \
            .github/workflows/g5-export.yml
          rm -f tools/apply_g5_repository_closure.py
          git add -A
          git commit -m 'fix(g5): guarantee cross-instance audit serialization'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g5
