name: hepta-archive-verifier-materialize-v1

on:
  push:
    branches:
      - 'ops/hepta-archive-verifier-materialize-20260909-v1'

permissions:
  contents: write

concurrency:
  group: hepta-archive-verifier-materialize-v1
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '7126fba941f339e8f123db8ffb5a937a5bb86500'
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable source and target lease
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='7126fba941f339e8f123db8ffb5a937a5bb86500'
          TARGET='codex/hepta-terminal-convergence-20260909'
          test "$(git rev-parse HEAD)" = "$SOURCE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE"
      - name: Materialize reviewed verifier bytes
        shell: bash
        env:
          PAYLOAD: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          data = zlib.decompress(base64.b64decode(os.environ['PAYLOAD'], validate=True))
          assert len(data) == 40952
          assert hashlib.sha256(data).hexdigest() == '154407030d0349b378a64688c84b7770f3f4a5567ea42af513b0cd5ca75551c6'
          path = Path('tools/verify_source_archive_receipt.py')
          path.write_bytes(data)
          PY
          test "$(git diff --name-only)" = 'tools/verify_source_archive_receipt.py'
          git diff --check
          python3 -m py_compile tools/verify_source_archive_receipt.py
          python3 tools/verify_source_archive_receipt.py --help >/dev/null
      - name: Commit and lease-protected push
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='7126fba941f339e8f123db8ffb5a937a5bb86500'
          TARGET='codex/hepta-terminal-convergence-20260909'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/verify_source_archive_receipt.py
          git commit -m 'release: verify durable exact-head source Artifact archives'
          git push origin \
            --force-with-lease="refs/heads/$TARGET:$SOURCE" \
            "HEAD:refs/heads/$TARGET"
