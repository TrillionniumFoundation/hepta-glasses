name: g7-p0-converge

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g7-p0-converge
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/hepta-glasses-gap-closure-g7
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply deterministic G7 P0 convergence
        run: python3 tools/apply_g7_p0_convergence.py
      - run: flutter pub get
      - name: Commit canonical Dart formatting
        run: dart format lib test
      - run: python3 tools/validate_repository.py
      - run: python3 -m unittest discover -s services -p 'test_*.py'
      - run: python3 -m unittest discover -s adapters -p 'test_*.py'
      - run: python3 -m compileall -q services adapters tools
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
      - run: python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
      - run: git diff --check
      - name: Commit and push verified source closure
        run: |
          set -euo pipefail
          git config user.name 'hepta-g7-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(g7): close exact-source P0 blockers'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g7
