name: hepta-p0-object-publisher-once

on:
  push:
    branches:
      - codex/hepta-p0-publisher-20260911

permissions:
  contents: write

concurrency:
  group: hepta-p0-object-publisher-once
  cancel-in-progress: false

jobs:
  materialize-clean-git-object:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 73c8b2f7204b7aa726f2e1d8932dc7cd22ddf648
      BASE_TREE: 1d1dca2b2e8ed6cc628850eb942d4dd9a5dc22d2
      EXPECTED_TREE: 057c9ca71ee8011d2c42cf9e6f83e40f6982c80c
      HELPER_BRANCH: codex/hepta-p0-publisher-20260911
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the previously validated source object
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "$HELPER_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf '%s  %s\n' \
            654bfa954a8b3a286ce529c8cf22a08f939957c906ea90ade08599b5a5de1f9c .publisher/p0.patch.b64.00 \
            06e1b94aaf9be3ce35e07bf9438d4c1e43a854c2ffeee9830f5a71e6cd4f6c4e .publisher/p0.patch.b64.01 \
            a2d9ce562b7413acb9c2a69178c52942646522f3f691b2e13d9737b6d1de1c18 .publisher/p0.patch.b64.02 \
            b68dd405926a631c808aee44a1b1b2fc8cbe47cfd9e8db4d040ee5f2423ca801 .publisher/p0.patch.b64.03 \
            7deb3dab03886335cad0d168a770e2f5ae427a96e5fcfbea5def852bfaa4a212 .publisher/p0.patch.b64.04 \
            891122b132d2fb6a3bcd90fbe2e27dec6611b4a55f742d3fc0079dfd10c3d49d .publisher/p0.patch.b64.05 \
            | sha256sum -c -
          cat .publisher/p0.patch.b64.* | base64 --decode > /tmp/p0.patch.gz
          printf '%s  %s\n' \
            29d0abdca67af88f40b9bc098b791cee14cb9ea79ee97cad115e0c52402b7949 /tmp/p0.patch.gz \
            | sha256sum -c -
          gzip --decompress --stdout /tmp/p0.patch.gz > /tmp/p0.patch
          printf '%s  %s\n' \
            57573774a3f5a8febc176264bf5923023b6b575f68ee9cfbf8cce7b96dd023cd /tmp/p0.patch \
            | sha256sum -c -
          git checkout --detach "$BASE_SHA"
          git apply --index /tmp/p0.patch
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "14"
          test ! -e .publisher
          test ! -e .github/workflows/hepta-p0-publisher-once.yml
      - name: Create the clean immutable commit object without moving any ref
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64, hashlib, json, os, subprocess, urllib.error, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_sha = os.environ['BASE_SHA']
          base_tree = os.environ['BASE_TREE']
          expected_tree = os.environ['EXPECTED_TREE']
          paths = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          expected = [
              '.github/workflows/ci.yml',
              'contracts/g1-command-matrix-v1.json',
              'docs/development/G1_PROTOCOL_COMMAND_MATRIX.md',
              'docs/modules/g1-protocol-features/README.md',
              'docs/modules/ios-native/README.md',
              'docs/modules/latest-head-ci-custody/README.md',
              'docs/modules/modules.json',
              'services/qualification/g1_command_matrix.py',
              'services/qualification/g1_command_matrix_impl.py',
              'services/qualification/test_dependency_automation.py',
              'services/qualification/test_g1_command_matrix.py',
              'services/qualification/test_ios_ci.py',
              'tools/ios_ci.py',
              'tools/native/dependency_update_policy.py',
          ]
          if sorted(paths) != sorted(expected):
              raise SystemExit(f'changed paths drifted: {paths!r}')

          def post(endpoint, document):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=json.dumps(document, separators=(',', ':')).encode(),
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'hepta-p0-object-publisher',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(
                      f'GitHub object API {endpoint} failed: {error.code}: {detail}'
                  ) from error

          entries, files = [], {}
          for relative in expected:
              raw = Path(relative).read_bytes()
              blob = post('/git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              mode = '100755' if relative == 'tools/ios_ci.py' else '100644'
              entries.append({
                  'path': relative, 'mode': mode, 'type': 'blob', 'sha': blob['sha']
              })
              files[relative] = {
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'blob': blob['sha'],
                  'mode': mode,
              }
          tree = post('/git/trees', {'base_tree': base_tree, 'tree': entries})
          if tree.get('sha') != expected_tree:
              raise SystemExit(
                  f"remote tree {tree.get('sha')} != expected {expected_tree}"
              )
          commit = post('/git/commits', {
              'message': (
                  'fix(p0): close iOS CI and G1 validation blockers\n\n'
                  'Use structured simulator selection with non-empty XCTest proof; '
                  'make the G1 matrix validator a single immutable authority; bind '
                  'source and tests by exact content, scopes, selectors and CI jobs '
                  'with hostile decoy coverage.'
              ),
              'tree': expected_tree,
              'parents': [base_sha],
          })
          result = {
              'schema_version': 1,
              'repository': repo,
              'base': base_sha,
              'tree': expected_tree,
              'commit': commit['sha'],
              'files': files,
              'ref_moved': False,
              'validated_by_workflow_run': 34561214486,
              'validated_tests': {'targeted': 67, 'adapters': 7},
          }
          output = Path('build/p0-ready-object')
          output.mkdir(parents=True, exist_ok=True)
          encoded = json.dumps(
              result, ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ).encode() + b'\n'
          (output / 'manifest.json').write_bytes(encoded)
          (output / 'manifest.sha256').write_text(
              hashlib.sha256(encoded).hexdigest() + '  manifest.json\n'
          )
          print(f"READY_COMMIT={commit['sha']}")
          print(f"READY_TREE={tree['sha']}")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-p0-ready-object-${{ github.sha }}
          path: build/p0-ready-object
          if-no-files-found: error
          retention-days: 30
