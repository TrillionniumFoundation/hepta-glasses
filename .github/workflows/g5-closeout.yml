name: g5-exact-head-closeout

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hepta-g5-closeout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_HEAD_SHA: ${{ github.sha }}
      SOURCE_BRANCH: codex/hepta-glasses-gap-closure-g5
      REVIEW_BASE: codex/hepta-glasses-source-closure-g4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Wait for the ordinary exact-head CI run
        id: ordinary
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            document="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$SOURCE_HEAD_SHA" \
              -f event=push \
              -f per_page=20)"
            run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.SOURCE_HEAD_SHA)) | sort_by(.created_at) | last | .id // empty' <<<"$document")"
            status="$(jq -r '.workflow_runs | map(select(.head_sha == env.SOURCE_HEAD_SHA)) | sort_by(.created_at) | last | .status // empty' <<<"$document")"
            conclusion="$(jq -r '.workflow_runs | map(select(.head_sha == env.SOURCE_HEAD_SHA)) | sort_by(.created_at) | last | .conclusion // empty' <<<"$document")"
            if [[ -n "$run_id" && "$status" == completed ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              [[ "$conclusion" == success ]]
              exit
            fi
            sleep 20
          done
          echo 'ordinary exact-head CI did not complete' >&2
          exit 1
      - name: Require every named source job to pass
        env:
          RUN_ID: ${{ steps.ordinary.outputs.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > build-jobs.json
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          documents = json.loads(Path('build-jobs.json').read_text())
          jobs = documents.get('jobs', []) if isinstance(documents, dict) else []
          required = {
              'repository-contracts',
              'flutter',
              'android-native',
              'ios-native',
              'native-sanitizers',
              'secret-and-boundary-scan',
              'source-evidence',
          }
          conclusions = {job.get('name'): job.get('conclusion') for job in jobs}
          missing = sorted(name for name in required if conclusions.get(name) != 'success')
          if missing:
              raise SystemExit(f'required jobs did not pass: {missing}; jobs={conclusions}')
          PYCODE
      - name: Download exact-head source evidence artifact
        env:
          RUN_ID: ${{ steps.ordinary.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/roundtrip
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "hepta-source-evidence-$SOURCE_HEAD_SHA" \
            --dir build/roundtrip
      - name: Independently verify downloaded artifact content
        env:
          RUN_ID: ${{ steps.ordinary.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 tools/evaluate_release_gate.py \
            --bundle build/roundtrip/source-release-bundle.json \
            --mode source \
            --evidence-dir build/roundtrip \
            --output build/roundtrip/roundtrip-gate-result.json
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('build/roundtrip')
          summary = json.loads((root / 'source-evidence-summary.json').read_text())
          gate = json.loads((root / 'source-gate-result.json').read_text())
          roundtrip = json.loads((root / 'roundtrip-gate-result.json').read_text())
          history = json.loads((root / 'source-history-scan.json').read_text())
          native = json.loads((root / 'source-native-sanitizer.json').read_text())
          sbom = json.loads((root / 'source-sbom.spdx.json').read_text())
          provenance = json.loads((root / 'source-provenance.json').read_text())

          expected_commit = os.environ['SOURCE_HEAD_SHA']
          expected_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          if summary.get('commit') != expected_commit or summary.get('tree') != expected_tree:
              raise SystemExit('summary source identity mismatch')
          if history.get('head') != expected_commit or history.get('finding_count') != 0:
              raise SystemExit('history scan is not exact-head clean')
          if native.get('passed') is not True or native.get('lc3_cross_platform_parity') is not True:
              raise SystemExit('native sanitizer/parity evidence failed')
          ecosystems = set(summary.get('sbom_ecosystems', []))
          required_ecosystems = {
              'android/gradle', 'dart/pub', 'ios/cocoapods', 'native/vendored'
          }
          if not required_ecosystems.issubset(ecosystems):
              raise SystemExit(f'incomplete SBOM ecosystems: {sorted(ecosystems)}')
          if gate.get('passed') is not True or roundtrip.get('passed') is not True:
              raise SystemExit('source gate did not pass before and after download')
          if provenance.get('type') != 'unsigned-source-provenance-v1':
              raise SystemExit('source provenance truth marker is missing')
          package_comments = {
              item.get('comment') for item in sbom.get('packages', [])
              if isinstance(item, dict)
          }
          for ecosystem in required_ecosystems:
              if f'ecosystem={ecosystem}' not in package_comments:
                  raise SystemExit(f'SBOM package inventory misses {ecosystem}')

          result = {
              'schema_version': 1,
              'source_status': 'VERIFIED_EXACT_HEAD',
              'repository': os.environ['REPOSITORY'],
              'commit': expected_commit,
              'tree': expected_tree,
              'workflow_run_id': int(os.environ['RUN_ID']),
              'artifact_name': f'hepta-source-evidence-{expected_commit}',
              'contracts_version': summary.get('contracts_version'),
              'history_finding_count': 0,
              'sbom_ecosystems': sorted(ecosystems),
              'native_sanitizers_passed': True,
              'lc3_cross_platform_parity': True,
              'source_gate_passed': True,
              'product_gate_claimed': False,
          }
          Path('build/g5-exact-head-closeout.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PYCODE
      - name: Open or update independent-review pull request
        env:
          RUN_ID: ${{ steps.ordinary.outputs.run_id }}
        run: |
          set -euo pipefail
          title='fix(g5): close independently audited source blockers'
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## G5 exact-head source closure

          - Head branch: \`$SOURCE_BRANCH\`
          - Exact head: \`$SOURCE_HEAD_SHA\`
          - Exact tree: \`$(git rev-parse 'HEAD^{tree}')\`
          - Ordinary CI run: \`$RUN_ID\`
          - Evidence artifact: \`hepta-source-evidence-$SOURCE_HEAD_SHA\`
          - Canonical plan: \`2026-08-31-g5\`
          - Downloaded artifact round-trip verification: **passed**

          ### Repository-side closures

          - cross-instance OS-file-locked audit journal and checkpoint recovery;
          - durable-storage startup fails closed;
          - Pub/Gradle/CocoaPods/vendored-native SPDX inventory;
          - all-fetched-ref redacted Git history scan;
          - LC3/RNNoise ASAN/UBSAN plus Android/iOS PCM parity;
          - release gate recomputes evidence digests and validates report content;
          - analyzer warnings are fatal.

          ### External truth retained

          This PR does not close physical G1 qualification, deployed KMS/HSM and
          attestation, branch-protection readback, vendor firmware/OTA authority,
          production realtime/OAuth receipts, provider-side credential rotation,
          independent security/privacy/legal/accessibility reviews, release
          signing, binary SBOM/attestation, pilot, kill-switch, rollback, or store
          approval. Those remain E5-E7 gates.

          The author/automation must not approve or merge this PR. Independent
          review by \`ProfHepta\` is requested.
          EOF
          number="$(gh pr list --repo "$REPOSITORY" --state open \
            --head "$SOURCE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --repo "$REPOSITORY" \
              --base "$REVIEW_BASE" \
              --head "$SOURCE_BRANCH" \
              --title "$title" \
              --body-file "$body_file"
            number="$(gh pr list --repo "$REPOSITORY" --state open \
              --head "$SOURCE_BRANCH" --json number --jq '.[0].number')"
          else
            gh pr edit "$number" --repo "$REPOSITORY" \
              --title "$title" --body-file "$body_file"
          fi
          gh api --method POST \
            "repos/$REPOSITORY/pulls/$number/requested_reviewers" \
            -f 'reviewers[]=ProfHepta'
          echo "review_pr=$number" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the G5 source tracker without touching external gates
        env:
          RUN_ID: ${{ steps.ordinary.outputs.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$REPOSITORY" --state open \
            --search 'HG-0044 in:title' --json number,title \
            --jq 'map(select(.title | contains("HG-0044"))) | .[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body \
              "Exact-head source gate and downloaded artifact round-trip passed for \`$SOURCE_HEAD_SHA\` in run \`$RUN_ID\`. Independent review and all E5-E7 gates remain separate."
            gh issue close "$issue" --repo "$REPOSITORY" --reason completed
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-g5-closeout-${{ github.sha }}
          path: |
            build/g5-exact-head-closeout.json
            build/roundtrip/roundtrip-gate-result.json
          if-no-files-found: error
          retention-days: 30
