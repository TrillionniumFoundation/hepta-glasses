name: hepta-identity-migration-retry

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910

permissions:
  contents: write

concurrency:
  group: hepta-identity-migration-retry
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASE_SHA: 487d06922133a521051eb54396c7efcb274ddbe1
      TARGET_BRANCH: codex/hepta-identity-migration-20260910
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact retry bootstrap
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          test "$(git rev-list --count "${BASE_SHA}"..HEAD)" -eq 3
          test "$(git rev-parse HEAD:.github/workflows/identity-migration-retry.yml)" = "$(git hash-object .github/workflows/identity-migration-retry.yml)"
          test -f .github/workflows/identity-migration-once.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Reproduce migration, repair typed BLE status, and bind native object
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import textwrap
          from pathlib import Path

          root = Path.cwd()
          source_path = root / ".github/workflows/identity-migration-once.yml"
          lines = source_path.read_text(encoding="utf-8").splitlines()
          starts = [index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'"]
          if len(starts) != 1:
              raise SystemExit(f"expected one migration heredoc, observed {len(starts)}")
          start = starts[0]
          ends = [index for index in range(start + 1, len(lines)) if lines[index].strip() == "PY"]
          if len(ends) != 1:
              raise SystemExit(f"expected one migration terminator, observed {len(ends)}")
          script = textwrap.dedent("\n".join(lines[start + 1 : ends[0]])) + "\n"
          namespace = {"__name__": "__main__", "__file__": str(source_path)}
          exec(compile(script, str(source_path), "exec"), namespace, namespace)

          identity_doc = root / "docs/development/PRODUCT_IDENTITY.md"
          identity_doc.write_text(
              identity_doc.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )

          wrong_status = ") == BluetoothGatt.GATT_SUCCESS"
          right_status = ") == android.bluetooth.BluetoothStatusCodes.SUCCESS"
          status_paths = (
              "android/app/src/main/kotlin/org/trillionnium/heptaglasses/model/BleDevice.kt",
              "android/app/src/main/kotlin/org/trillionnium/heptaglasses/bluetooth/BleManager.kt",
          )
          for relative in status_paths:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              if text.count(wrong_status) != 1:
                  raise SystemExit(f"expected one API 33 status-domain defect in {relative}")
              path.write_text(text.replace(wrong_status, right_status, 1), encoding="utf-8")

          native_path = "android/app/src/main/cpp/liblc3.cpp"
          native_blob = subprocess.check_output(
              ["git", "hash-object", native_path], cwd=root, text=True
          ).strip()
          if len(native_blob) != 40:
              raise SystemExit("native integration blob was not computed")

          manifest_path = root / "third_party/native-import-provenance.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = [
              item
              for item in manifest.get("integration_files", [])
              if isinstance(item, dict) and item.get("path") == native_path
          ]
          if len(records) != 1:
              raise SystemExit("native provenance integration record is ambiguous")
          old_blob = records[0].get("current_blob")
          if not isinstance(old_blob, str) or len(old_blob) != 40:
              raise SystemExit("native provenance prior current blob is malformed")
          records[0]["current_blob"] = native_blob
          records[0]["status"] = "local_integration_delta"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          provenance_doc = root / "docs/development/NATIVE_DEPENDENCY_PROVENANCE.md"
          provenance_text = provenance_doc.read_text(encoding="utf-8")
          if provenance_text.count(old_blob) != 1:
              raise SystemExit("native provenance document prior blob binding is not unique")
          provenance_doc.write_text(
              provenance_text.replace(old_blob, native_blob, 1).rstrip() + "\n",
              encoding="utf-8",
          )

          retry = root / ".github/workflows/identity-migration-retry.yml"
          if retry.exists():
              retry.unlink()
          if source_path.exists():
              raise SystemExit("original one-shot workflow was not removed")
          print(json.dumps({
              "migration_script_sha": subprocess.check_output(
                  ["git", "hash-object", "--stdin"], input=script, cwd=root, text=True
              ).strip(),
              "native_integration_old_blob": old_blob,
              "native_integration_new_blob": native_blob,
              "api33_status_repairs": len(status_paths),
          }, sort_keys=True))
          PY
      - name: Create local candidate commit without publishing
        run: |
          set -euo pipefail
          test ! -e .github/workflows/identity-migration-once.yml
          test ! -e .github/workflows/identity-migration-retry.yml
          test -d android/app/src/main/kotlin/org/trillionnium/heptaglasses
          test -d android/app/src/test/kotlin/org/trillionnium/heptaglasses
          test ! -e android/app/src/main/kotlin/com/example/demo_ai_even
          test ! -e android/app/src/test/kotlin/com/example/demo_ai_even
          grep -qx 'name: hepta_glasses' <(head -n1 pubspec.yaml)
          grep -q 'namespace = "org.trillionnium.heptaglasses"' android/app/build.gradle
          grep -q 'Java_org_trillionnium_heptaglasses_cpp_Cpp_decodeLC3' android/app/src/main/cpp/liblc3.cpp
          test "$(grep -R --include='*.kt' -F ') == android.bluetooth.BluetoothStatusCodes.SUCCESS' android/app/src/main/kotlin/org/trillionnium/heptaglasses | wc -l)" -eq 2
          git diff --check
          git config user.name 'hepta-identity-migration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- build || true
          mapfile -t workflow_changes < <(git diff --cached --name-only -- .github/workflows)
          test "${#workflow_changes[@]}" -eq 2
          printf '%s\n' "${workflow_changes[@]}" | grep -qx '.github/workflows/identity-migration-once.yml'
          printf '%s\n' "${workflow_changes[@]}" | grep -qx '.github/workflows/identity-migration-retry.yml'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'refactor: complete canonical product package migration'
          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
      - name: Qualify committed Dart and Android identity
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos --fatal-warnings
          flutter test
          flutter build apk --debug
          (
            cd android
            ./gradlew lintDebug testDebugUnitTest
          )
          git diff --exit-code
      - name: Qualify committed repository and native custody
        env:
          CI_REPOSITORY_CONTRACTS: success
          CI_FLUTTER: success
          CI_ANDROID_NATIVE: success
          CI_IOS_NATIVE: success
          CI_NATIVE_SANITIZERS: success
          CI_SECRET_SCAN: success
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          python3 tools/validate_repository.py
          python3 tools/validate_repository_metadata.py
          python3 tools/validate_production_authority.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
          git diff --exit-code -- . ':(exclude)build'
      - name: Publish only the qualified commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
          test ! -e .github/workflows/identity-migration-once.yml
          test ! -e .github/workflows/identity-migration-retry.yml
          git push origin HEAD:"${TARGET_BRANCH}"
