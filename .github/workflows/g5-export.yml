name: g5-export-source

on:
  push:
    branches:
      - codex/hepta-glasses-audit-closure-g5

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Create source snapshot
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/hepta-g5-source.tar.gz .
          sha256sum /tmp/hepta-g5-source.tar.gz > /tmp/hepta-g5-source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-g5-source-${{ github.sha }}
          path: |
            /tmp/hepta-g5-source.tar.gz
            /tmp/hepta-g5-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
