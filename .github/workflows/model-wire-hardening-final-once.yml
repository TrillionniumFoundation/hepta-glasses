name: hepta-model-wire-hardening-final-once

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910

permissions:
  contents: write

concurrency:
  group: hepta-model-wire-hardening-final-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FINAL_BASE_SHA: feef33bec46741bd7dc16e262806bf75ff3f5793
      TARGET_BRANCH: codex/hepta-identity-migration-20260910
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact final bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$FINAL_BASE_SHA"
          changed="$(git diff --name-only "$FINAL_BASE_SHA" HEAD)"
          test "$changed" = ".github/workflows/model-wire-hardening-final-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Reapply reviewed transformation with deterministic test fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/model-wire-hardening-once.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = textwrap.dedent(source[start:end])
          Path('/tmp/model-wire-patch.py').write_text(payload + '\n', encoding='utf-8')
          PY
          python3 /tmp/model-wire-patch.py
          cat > services/model_gateway/test_app.py <<'PY'
          from __future__ import annotations

          import json
          import unittest
          from http import HTTPStatus

          from services.model_gateway.app import (
              RequestError,
              _closed_json_object,
              _reject_json_constant,
              authorize,
              deterministic_answer,
              validate_chat_request,
              validate_server_token,
          )


          class ModelGatewayTest(unittest.TestCase):
              def test_valid_request_is_minimized_and_response_is_closed(self) -> None:
                  request = validate_chat_request(
                      {"question": "  status  ", "task_id": "task-1", "context": {}}
                  )
                  self.assertEqual(request.question, "status")
                  self.assertEqual(
                      deterministic_answer(request),
                      {"answer": "Hepta development gateway received 6 characters."},
                  )
                  self.assertEqual(set(deterministic_answer(request)), {"answer"})

              def test_unknown_field_fails_closed(self) -> None:
                  with self.assertRaises(RequestError) as raised:
                      validate_chat_request({"question": "status", "credential": "secret"})
                  self.assertEqual(raised.exception.code, "unknown_request_fields")

              def test_duplicate_json_member_fails_closed(self) -> None:
                  with self.assertRaises(RequestError) as raised:
                      json.loads(
                          '{"question":"first","question":"second"}',
                          object_pairs_hook=_closed_json_object,
                          parse_constant=_reject_json_constant,
                      )
                  self.assertEqual(raised.exception.code, "duplicate_json_member")

              def test_non_finite_json_number_fails_closed(self) -> None:
                  with self.assertRaises(RequestError) as raised:
                      json.loads(
                          '{"question":"status","context":{"value":NaN}}',
                          object_pairs_hook=_closed_json_object,
                          parse_constant=_reject_json_constant,
                      )
                  self.assertEqual(raised.exception.code, "invalid_json")

              def test_large_question_has_stable_status(self) -> None:
                  with self.assertRaises(RequestError) as raised:
                      validate_chat_request({"question": "x" * 8_001})
                  self.assertEqual(
                      raised.exception.status,
                      HTTPStatus.REQUEST_ENTITY_TOO_LARGE,
                  )

              def test_token_comparison(self) -> None:
                  self.assertTrue(authorize("Bearer expected", "expected"))
                  self.assertFalse(authorize("Bearer wrong", "expected"))
                  self.assertFalse(authorize(None, None))

              def test_server_token_is_mandatory_and_bounded(self) -> None:
                  with self.assertRaises(RequestError) as missing:
                      validate_server_token(None)
                  self.assertEqual(
                      missing.exception.code,
                      "gateway_token_missing_or_too_short",
                  )
                  with self.assertRaises(RequestError):
                      validate_server_token("short")
                  token = "t" * 32
                  self.assertEqual(validate_server_token(token), token)


          if __name__ == "__main__":
              unittest.main()
          PY
          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              '.github/workflows/model-wire-hardening-retry-once.yml',
              '.github/workflows/model-wire-hardening-final-once.yml',
          ):
              Path(relative).unlink()
          PY
      - name: Validate exact model boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q services/model_gateway
          python3 -m unittest services.model_gateway.test_app -v
          flutter pub get
          dart format lib/runtime/model_gateway.dart test/runtime/model_gateway_test.dart
          flutter test test/runtime/model_gateway_test.dart
          flutter analyze --no-fatal-infos
          git diff --check
          test ! -e .github/workflows/model-wire-hardening-once.yml
          test ! -e .github/workflows/model-wire-hardening-retry-once.yml
          test ! -e .github/workflows/model-wire-hardening-final-once.yml
      - name: Publish exact tested source successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-source-closure-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no source changes produced' >&2; exit 1; }
          git commit -m 'security: fail model requests before unauthenticated egress'
          git push origin "HEAD:${TARGET_BRANCH}"
