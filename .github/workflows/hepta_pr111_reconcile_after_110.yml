name: hepta-pr111-reconcile-after-pr110

on:
  push:
    branches:
      - 'ops/hepta-pr110-format-20260909-v1'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: hepta-pr111-reconcile-after-pr110
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for same-head PR 110 audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OPS_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          head = os.environ['OPS_HEAD']
          workflow = urllib.parse.quote('hepta_pr110_exact_head_audit.yml', safe='')
          url = f'https://api.github.com/repos/{repository}/actions/workflows/{workflow}/runs?branch=ops/hepta-pr110-format-20260909-v1&per_page=20'
          deadline = time.monotonic() + 25 * 60
          while time.monotonic() < deadline:
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'hepta-pr111-reconcile/1',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.loads(response.read())['workflow_runs']
              matches = [run for run in runs if run.get('head_sha') == head]
              if matches:
                  run = max(matches, key=lambda item: item['run_attempt'])
                  if run['status'] == 'completed':
                      if run['conclusion'] != 'success':
                          raise SystemExit(f"same-head PR 110 audit failed: {run['html_url']}")
                      print(json.dumps({'audit_run': run['id'], 'conclusion': 'success'}))
                      break
              time.sleep(20)
          else:
              raise SystemExit('timed out waiting for same-head PR 110 audit')
          PY
      - name: Reconcile the PR 111 stack exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GH_REPOSITORY"
          parent_branch='codex/hepta-critical-test-depth-20260908'
          old_base_branch='codex/hepta-mobile-product-identity-20260908'
          version_branch='codex/hepta-version-authority-20260908'
          sentinel='docs/development/VERSION_AUTHORITY_REBASE_READY'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${repository}.git"

          pr_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/pulls/111")"
          base_ref="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' <<<"$pr_json")"
          base_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])' <<<"$pr_json")"
          old_head="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"$pr_json")"

          git clone --filter=blob:none "$remote" repository
          cd repository
          git fetch origin \
            "refs/heads/${parent_branch}:refs/remotes/origin/${parent_branch}" \
            "refs/heads/${version_branch}:refs/remotes/origin/${version_branch}"
          parent_head="$(git rev-parse "origin/${parent_branch}")"
          test "$(git rev-parse "origin/${version_branch}")" = "$old_head"

          if [ "$base_ref" = "$parent_branch" ]; then
            git merge-base --is-ancestor "$parent_head" "$old_head"
            git cat-file -e "${old_head}:${sentinel}"
            echo "PR #111 is already correctly stacked at ${old_head}."
            exit 0
          fi
          test "$base_ref" = "$old_base_branch"
          git merge-base --is-ancestor "$base_sha" "$parent_head"
          git merge-base --is-ancestor "$base_sha" "$old_head"
          test -z "$(git rev-list --merges "${base_sha}..${old_head}")"
          test "$(git rev-list --count "${base_sha}..${old_head}")" -gt 0

          git checkout -B version-work "origin/${version_branch}"
          git rebase --onto "$parent_head" "$base_sha" version-work
          test "$(git rev-list --count "${parent_head}..HEAD")" -gt 0
          test -z "$(git rev-list --merges "${parent_head}..HEAD")"
          mkdir -p "$(dirname "$sentinel")"
          : > "$sentinel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$sentinel"
          git commit -m 'chore: bind version authority stack to qualified critical-depth parent'
          new_head="$(git rev-parse HEAD)"
          git push origin \
            --force-with-lease="refs/heads/${version_branch}:${old_head}" \
            "HEAD:refs/heads/${version_branch}"

          curl --fail --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/pulls/111" \
            -d "$(python3 -c 'import json; print(json.dumps({"base":"codex/hepta-critical-test-depth-20260908","title":"[DRAFT / REQUALIFYING] semantic version authority on qualified critical-depth parent"}))')" \
            >/dev/null
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/issues/111/comments" \
            -d "$(python3 - "$parent_head" "$new_head" <<'PY'
          import json, sys
          parent, head = sys.argv[1:]
          print(json.dumps({'body': (
              '## Idempotent stack reconciliation completed\n\n'
              f'PR #111 was linearly replayed on PR #110 head `{parent}` and now points to `{head}`. '
              'No CI, Artifact, review or prospective-merge evidence transfers from the old head.'
          )}))
          PY
          )" \
            >/dev/null
