name: hepta-g7-report

on:
  workflow_run:
    workflows:
      - hepta-glasses-g7-exact-head
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'codex/hepta-glasses-gap-closure-g7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish redacted exact-head result on PR 20
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > /tmp/jobs.json
          python3 - <<'PYCODE' > /tmp/report.md
          import json
          import os
          from pathlib import Path

          jobs = json.loads(Path('/tmp/jobs.json').read_text())['jobs']
          print('<!-- hepta-g7-exact-head-report -->')
          print('## G7 exact-head qualification')
          print()
          print(f"- Head: `{os.environ['HEAD_SHA']}`")
          print(f"- Run: `{os.environ['RUN_ID']}`")
          print(f"- Conclusion: **{os.environ['RUN_CONCLUSION']}**")
          print()
          print('| Job | Status | Conclusion |')
          print('|---|---|---|')
          for job in sorted(jobs, key=lambda item: item['name']):
              print(
                  f"| `{job['name']}` | {job['status']} | "
                  f"{job.get('conclusion') or 'pending'} |"
              )
          print()
          print('This report contains status metadata only; it does not include secret matches or logs.')
          PYCODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/20/comments" \
            -f body="$(cat /tmp/report.md)"
