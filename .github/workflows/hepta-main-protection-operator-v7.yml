name: hepta-main-protection-operator-v7

on:
  push:
    branches:
      - ops/hepta-main-protection-20260908-v7

permissions:
  contents: read

concurrency:
  group: hepta-main-protection-operator-v7
  cancel-in-progress: false

jobs:
  apply-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEPTA_REPO_ADMIN_TOKEN: ${{ secrets.HEPTA_REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify operator branch derives from approved source candidate
        run: |
          git merge-base --is-ancestor 35f01329262d6a137bfa3c7e95302a397ed32676 HEAD
          test -f contracts/main-branch-protection-v1.json
          test -f tools/repository_governance.py

      - name: Apply canonical protection and evaluate immediate readback
        id: apply
        shell: bash
        run: |
          set +x
          mkdir -p build/governance
          set +e
          python3 tools/repository_governance.py --apply \
            > build/governance/apply-result.json \
            2> build/governance/apply-stderr.log
          rc=$?
          set -e
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          APPLY_RC="$rc" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path('build/governance/operator-metadata.json').write_text(
              json.dumps(
                  {
                      'schema_version': 1,
                      'generated_at': datetime.now(timezone.utc).isoformat(),
                      'repository': os.environ['GITHUB_REPOSITORY'],
                      'workflow_sha': os.environ['GITHUB_SHA'],
                      'approved_source_head': '35f01329262d6a137bfa3c7e95302a397ed32676',
                      'target_branch': 'main',
                      'admin_secret_present': bool(os.environ.get('HEPTA_REPO_ADMIN_TOKEN')),
                      'apply_returncode': int(os.environ['APPLY_RC']),
                  },
                  sort_keys=True,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Capture complete protection readback after successful apply
        if: steps.apply.outputs.rc == '0'
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ.get('HEPTA_REPO_ADMIN_TOKEN', '')
          if not token:
              raise SystemExit('admin_token_required')
          request = urllib.request.Request(
              'https://api.github.com/repos/TrillionniumFoundation/hepta-glasses/branches/main/protection',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8'))
          encoded = (json.dumps(payload, sort_keys=True, indent=2) + '\n').encode('utf-8')
          Path('build/governance/protection-readback.json').write_bytes(encoded)
          Path('build/governance/protection-readback.sha256').write_text(
              hashlib.sha256(encoded).hexdigest() + '  protection-readback.json\n',
              encoding='utf-8',
          )
          PY

      - name: Upload redacted governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-main-protection-operator-v7-${{ github.sha }}
          path: build/governance
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when administration transaction did not pass
        if: steps.apply.outputs.rc != '0'
        run: exit "${{ steps.apply.outputs.rc }}"
