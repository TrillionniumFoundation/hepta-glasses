name: g5-ios-preflight

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5

permissions:
  contents: write

concurrency:
  group: hepta-g5-ios-preflight
  cancel-in-progress: false

jobs:
  ios-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact preflight input
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Build and test iOS exactly
        run: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install --deployment
          cd ..
          flutter build ios --simulator --debug
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in sorted(devices, reverse=True) for device in devices[runtime] if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Commit preflight evidence marker and remove workflow
        run: |
          mkdir -p docs/evidence
          cat > docs/evidence/G5_IOS_PREFLIGHT.md <<EOF
          # G5 iOS source preflight

          Tested input commit: \`${{ github.sha }}\`
          Workflow run: \`${{ github.run_id }}\`
          Result: Flutter iOS simulator build and Runner XCTest passed.

          This is E3 source/platform evidence only. It is not physical-device,
          signing, App Store, or product-release evidence.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/g5-ios-preflight.yml
          git add docs/evidence/G5_IOS_PREFLIGHT.md
          git commit -m 'test(g5): record passing iOS source preflight'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g5
