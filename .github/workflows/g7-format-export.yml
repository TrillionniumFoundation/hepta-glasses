name: g7-format-and-history-fix

on:
  push:
    branches:
      - bootstrap/hepta-glasses-g7-format
    paths:
      - '.github/workflows/g7-format-export.yml'

permissions:
  contents: write

concurrency:
  group: hepta-g7-format-fix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 1be0adc5bb738b2dcd87eefe0c3d67276575131d
      TARGET_BRANCH: codex/hepta-glasses-gap-closure-g7
      BUNDLE_SHA256: 1491b92f8b884cd66448941429751791b0a791b6ad4738979a4e94594e46146d
    steps:
      - name: Check out exact bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Capture and verify formatted source bundle
        run: |
          set -euo pipefail
          base64 -d tools/g7-six-files.tar.gz.b64 > /tmp/g7-six-files.tar.gz
          printf '%s  %s\n' "$BUNDLE_SHA256" /tmp/g7-six-files.tar.gz | sha256sum -c -
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact files and run full source qualification
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_SHA"
          tar -xzf /tmp/g7-six-files.tar.gz
          git add \
            tools/scan_git_history.py \
            services/qualification/test_history_scan.py \
            lib/controllers/bmp_update_manager.dart \
            lib/services/evenai.dart \
            test/runtime/audit_journal_test.dart \
            test/runtime/bmp_update_manager_test.dart
          git diff --cached --check
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          tools/run_native_sanitizers.sh /tmp/g7-native-sanitizer.json
      - name: Publish one non-workflow commit to G7
        run: |
          set -euo pipefail
          git config user.name 'Hepta G7 Qualification Fix'
          git config user.email 'actions@users.noreply.github.com'
          tree="$(git write-tree)"
          commit="$(printf '%s\n\n%s\n' \
            'fix(g7): close format and synthetic-history blockers' \
            'Restores the Flutter 3.47.2-formatted files and exact object/path/fingerprint fixture allowlist.' \
            | git commit-tree "$tree" -p "$TARGET_SHA")"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_SHA}" \
            origin "${commit}:refs/heads/${TARGET_BRANCH}"
          echo "G7_COMMIT=${commit}" >> "$GITHUB_ENV"
