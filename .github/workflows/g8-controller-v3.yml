name: g8-controller-v3

on:
  push:
    branches:
      - ops/hepta-g8-controller-v3-20260831

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: g8-controller-v3-${{ github.ref }}
  cancel-in-progress: false

env:
  READY_BRANCH: work/hepta-glasses-g8-truth-ready
  VALIDATION_BRANCH: codex/hepta-glasses-gap-closure-g8-validation-v2-external
  PR_BRANCH: codex/hepta-glasses-gap-closure-g8
  PR_NUMBER: '23'

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Require validation ref and ready ref to be the same commit
        id: source
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            ready_ok=false
            validation_ok=false
            if git fetch --force origin "refs/heads/$READY_BRANCH:refs/remotes/origin/$READY_BRANCH"; then
              ready_ok=true
            fi
            if git fetch --force origin "refs/heads/$VALIDATION_BRANCH:refs/remotes/origin/$VALIDATION_BRANCH"; then
              validation_ok=true
            fi
            if $ready_ok && $validation_ok; then
              ready="$(git rev-parse "refs/remotes/origin/$READY_BRANCH^{commit}")"
              validation="$(git rev-parse "refs/remotes/origin/$VALIDATION_BRANCH^{commit}")"
              if test "$ready" = "$validation"; then
                break
              fi
            fi
            if test "$attempt" = 720; then
              echo 'external validation ref did not converge to ready ref' >&2
              exit 1
            fi
            sleep 10
          done
          sha="$(git rev-parse "refs/remotes/origin/$VALIDATION_BRANCH^{commit}")"
          git checkout --detach "$sha"
          dart format --output=none --set-exit-if-changed lib test
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          find services adapters tools -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for externally-triggered seven-job CI and source artifact
        id: formal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/controller-v3
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']; head=os.environ['HEAD_SHA']
          branch=os.environ['VALIDATION_BRANCH']; api=f'https://api.github.com/repos/{repo}'
          expected={'repository-contracts','flutter','android-native','ios-native','native-sanitizers','secret-and-boundary-scan','source-evidence'}

          def request(path, *, method='GET', payload=None, statuses={200}):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(api+path,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}', 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'hepta-g8-controller-v3'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as response:
                      raw=response.read(); status=response.status
              except urllib.error.HTTPError as error:
                  raw=error.read(); status=error.code
              value=json.loads(raw) if raw else None
              if status not in statuses:
                  raise RuntimeError(f'{method} {path}: HTTP {status}: {value}')
              return value

          def matching_runs():
              query=urllib.parse.urlencode({'branch':branch,'per_page':30})
              value=request('/actions/runs?'+query)
              return sorted([
                  item for item in value.get('workflow_runs',[])
                  if item.get('name')=='hepta-glasses-ci' and item.get('head_sha')==head
              ], key=lambda item:str(item.get('created_at') or ''), reverse=True)

          def validate(run):
              run_id=int(run['id'])
              jobs=request(f'/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
              by_name={job.get('name'):job for job in jobs}
              if set(by_name)!=expected:
                  raise RuntimeError(f'job set mismatch for run {run_id}: {sorted(by_name)}')
              bad={name:job.get('conclusion') for name,job in by_name.items() if job.get('conclusion')!='success'}
              if bad: raise RuntimeError(f'run {run_id} has non-success jobs: {bad}')
              empty=[name for name,job in by_name.items() if not job.get('steps')]
              if empty: raise RuntimeError(f'run {run_id} has empty jobs: {empty}')
              artifacts=request(f'/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
              expected_name='hepta-source-evidence-'+head
              matches=[a for a in artifacts if a.get('name')==expected_name and not a.get('expired')]
              if len(matches)!=1: raise RuntimeError(f'run {run_id} has {len(matches)} matching artifacts')
              artifact=matches[0]; digest=str(artifact.get('digest') or '')
              if not digest.startswith('sha256:'): raise RuntimeError('artifact digest is not SHA-256')
              return {
                  'schema_version':1,'head_sha':head,'workflow_run_id':run_id,'event':run.get('event'),
                  'required_jobs':{name:{'conclusion':by_name[name].get('conclusion'),'step_count':len(by_name[name].get('steps') or [])} for name in sorted(expected)},
                  'source_evidence_artifact':{'id':artifact['id'],'name':artifact['name'],'digest':digest,'size_in_bytes':artifact.get('size_in_bytes')},
              }

          deadline=time.time()+10000; rerun=set(); result=None
          while time.time()<deadline:
              runs=matching_runs()
              for run in runs:
                  if run.get('status')=='completed' and run.get('conclusion')=='success':
                      result=validate(run); break
              if result: break
              active=[run for run in runs if run.get('status')!='completed']
              failures=[run for run in runs if run.get('status')=='completed' and run.get('conclusion') not in (None,'success','cancelled')]
              if failures:
                  run_id=int(failures[0]['id'])
                  if run_id not in rerun:
                      request(f'/actions/runs/{run_id}/rerun-failed-jobs',method='POST',statuses={201,202})
                      rerun.add(run_id); time.sleep(15); continue
                  if not active:
                      Path('build/controller-v3/formal-failure.json').write_text(json.dumps(failures[0],indent=2,sort_keys=True)+'\n')
                      raise SystemExit(f'external CI run {run_id} remained failed after one retry')
              time.sleep(15)
          if result is None: raise SystemExit('external exact-head CI did not become successful')
          Path('build/controller-v3/formal-result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Promote the immutable verified SHA to PR 23
        run: |
          set -euo pipefail
          sha='${{ steps.source.outputs.sha }}'
          git push --force origin "$sha:refs/heads/$PR_BRANCH"
      - name: Bind exact source evidence and preserve external gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']; head=os.environ['HEAD_SHA']; pr=int(os.environ['PR_NUMBER'])
          api=f'https://api.github.com/repos/{repo}'
          formal=json.loads(Path('build/controller-v3/formal-result.json').read_text())
          marker=f'<!-- hepta-g8-v3:{head} -->'

          def request(path, *, method='GET', payload=None, statuses={200}):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(api+path,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'hepta-g8-controller-v3'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as response:
                      raw=response.read(); status=response.status
              except urllib.error.HTTPError as error:
                  raw=error.read(); status=error.code
              value=json.loads(raw) if raw else None
              if status not in statuses: raise RuntimeError(f'{method} {path}: HTTP {status}: {value}')
              return status,value

          pr_value=None
          for _ in range(60):
              _,pr_value=request(f'/pulls/{pr}')
              if pr_value['head']['sha']==head: break
              time.sleep(2)
          if pr_value is None or pr_value['head']['sha']!=head: raise SystemExit('PR head did not converge')

          artifact=formal['source_evidence_artifact']
          _,comments=request(f'/issues/{pr}/comments?per_page=100')
          if not any(marker in str(item.get('body') or '') for item in comments):
              body='\n'.join([marker,'G8 exact-head source verification completed through an externally-triggered CI run.','',f'- Head: `{head}`',f'- Formal CI run: `{formal["workflow_run_id"]}`','- Required jobs: all seven non-empty and successful',f'- Source evidence artifact: `{artifact["name"]}`',f'- Artifact digest: `{artifact["digest"]}`','','The identical commit is now PR #23 head. The automation did not approve or merge it; external E5-E7 gates remain open.'])
              request(f'/issues/{pr}/comments',method='POST',payload={'body':body},statuses={201})

          notes={24:'Physical Android/iOS plus real G1 qualification remains required.',25:'Deployed identity, KMS/HSM, attestation, rotation, revocation, and recovery evidence remains required.',26:'Authorized branch-protection administration and readback evidence remains required.',27:'Vendor-authorized firmware, bootloader, secure boot, OTA, recovery, and rollback authority remains required.',28:'Production realtime/model tenancy, OAuth adapters, and authoritative reconciliation evidence remains required.',29:'Independent assurance, signing, pilot, kill switch, rollout, rollback, and store approval remain required.'}
          for issue,note in notes.items():
              _,value=request(f'/issues/{issue}')
              if value.get('state')!='open': raise RuntimeError(f'external issue {issue} unexpectedly closed')
              _,existing=request(f'/issues/{issue}/comments?per_page=100')
              if any(marker in str(item.get('body') or '') for item in existing): continue
              body='\n'.join([marker,'G8 source-preparation baseline refreshed.','',f'- Exact head: `{head}`',f'- Formal seven-job CI run: `{formal["workflow_run_id"]}`',f'- Source evidence artifact: `{artifact["name"]}`',f'- Artifact digest: `{artifact["digest"]}`','',note,'This issue remains open; source evidence is not being promoted to E5-E7.'])
              request(f'/issues/{issue}/comments',method='POST',payload={'body':body},statuses={201})

          reviewer_status,reviewer_response=request(f'/pulls/{pr}/requested_reviewers',method='POST',payload={'reviewers':['ProfHepta']},statuses={201,403,404,422})
          _,reviews=request(f'/pulls/{pr}/reviews?per_page=100')
          independent=[r.get('user',{}).get('login') for r in reviews if r.get('state')=='APPROVED' and r.get('commit_id')==head and r.get('user',{}).get('login') not in {'Tomasrgbsf','github-actions[bot]'}]
          protection_status,_=request('/branches/main/protection',statuses={200,403,404})
          state={'schema_version':1,'repository':repo,'pull_request':pr,'head_sha':head,'formal_ci':formal,'repository_actionable_source_gaps':'closed','review_request':{'reviewer':'ProfHepta','http_status':reviewer_status,'requested':reviewer_status==201,'response':reviewer_response},'independent_approvals_for_exact_head':independent,'independent_review':'approved' if independent else 'pending','main_protection_readback_http_status':protection_status,'external_gates':['HG-0015','HG-0016','HG-0017','HG-0018','HG-0019','HG-0020'],'merged':False,'released':False}
          Path('build/controller-v3/final-state.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-g8-controller-v3-${{ steps.source.outputs.sha }}
          path: build/controller-v3
          if-no-files-found: error
          retention-days: 30
      - name: Clean temporary G8 refs
        run: |
          set -euo pipefail
          for branch in \
            work/hepta-glasses-gap-closure-g8-materialize \
            work/hepta-glasses-gap-closure-g8-diagnostics \
            work/hepta-glasses-g8-truth-materialize \
            work/hepta-glasses-g8-truth-ready \
            codex/hepta-glasses-gap-closure-g8-validation \
            codex/hepta-glasses-gap-closure-g8-validation-final \
            codex/hepta-glasses-gap-closure-g8-validation-external \
            codex/hepta-glasses-gap-closure-g8-validation-v2-external \
            ops/hepta-g8-truth-export-20260831 \
            ops/hepta-g8-finalize-20260831 \
            ops/hepta-g8-postfinalize-20260831 \
            ops/hepta-g8-external-watch-20260831 \
            ops/hepta-g8-external-complete-20260831 \
            ops/hepta-g8-controller-v2-20260831; do
            git push origin --delete "$branch" || true
          done
