name: g5-audit-lock-final-fix

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5

permissions:
  contents: write

concurrency:
  group: hepta-g5-final-fixes
  cancel-in-progress: false

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Add a path-keyed same-process queue outside the OS lock
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('lib/runtime/audit_journal.dart')
          text = path.read_text()
          old_field = '  Future<void> _tail = Future<void>.value();\n\n  static File lockFileFor'
          new_field = '''  static final Map<String, Future<void>> _pathTails =
              <String, Future<void>>{};

          String get _pathLockKey => lockFileFor(file).absolute.path;

          static File lockFileFor'''
          if old_field in text:
              text = text.replace(old_field, new_field, 1)
          old_method = '''  Future<T> _exclusive<T>(Future<T> Function() operation) {
              final completer = Completer<T>();
              _tail = _tail.then((_) async {
                try {
                  completer.complete(await _withFileLock(operation));
                } on Object catch (error, stackTrace) {
                  completer.completeError(error, stackTrace);
                }
              });
              return completer.future;
            }
          '''
          new_method = '''  Future<T> _exclusive<T>(Future<T> Function() operation) {
              final completer = Completer<T>();
              final key = _pathLockKey;
              final previous = _pathTails[key] ?? Future<void>.value();
              final scheduled = previous.then((_) async {
                try {
                  completer.complete(await _withFileLock(operation));
                } on Object catch (error, stackTrace) {
                  completer.completeError(error, stackTrace);
                }
              });
              _pathTails[key] = scheduled;
              unawaited(scheduled.whenComplete(() {
                if (identical(_pathTails[key], scheduled)) {
                  _pathTails.remove(key);
                }
              }));
              return completer.future;
            }
          '''
          if old_method in text:
              text = text.replace(old_method, new_method, 1)
          if '_pathTails' not in text or 'Future<void> _tail' in text:
              raise SystemExit('audit queue patch did not apply exactly')
          path.write_text(text)
          PYCODE
      - name: Run exact Dart gates
        run: |
          flutter pub get
          dart format lib/runtime/audit_journal.dart test/runtime/audit_journal_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/runtime/audit_journal_test.dart
          flutter test
      - name: Commit tested fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/g5-audit-lock-fix.yml
          git add lib/runtime/audit_journal.dart test/runtime/audit_journal_test.dart
          git commit -m 'fix(g5): serialize audit access across journal instances'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g5
