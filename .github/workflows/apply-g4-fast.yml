name: hepta-g4-fast-applier

on:
  push:
    branches:
      - codex/hepta-glasses-source-closure-g4

permissions:
  contents: write

concurrency:
  group: hepta-g4-fast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-g4-fast]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Apply deterministic G4 source closure
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('tools/apply_g4_ci_unblock.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '{"__name__": "__main__"},',
              '{"__name__": "__main__", "__file__": __file__},',
          )
          namespace = {'__name__': '__main__', '__file__': str(path.resolve())}
          exec(compile(source, str(path), 'exec'), namespace)
          PYCODE
      - name: Normalize and validate
        run: |
          flutter pub get
          dart format lib test
          python3 -m compileall -q services adapters tools
          git diff --check
      - name: Commit normalized source tree
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The migration payload contains historical workflow normalization.
          # Preserve the already-reviewed exact-head CI definitions; the GitHub
          # Actions token is deliberately not permitted to mutate workflows.
          git restore --source=HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply G4 runtime closure [normalize-g4]"
          git push origin "HEAD:${TARGET_BRANCH}"
