name: g5-finalize-contextual-migrations

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5

permissions:
  contents: write

concurrency:
  group: hepta-g5-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact migration input
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic contextual migrations
        run: python3 tools/apply_g5_repository_closure.py
      - name: Finalize scanner fixtures and shell invocation
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          scanner = Path('tools/scan_git_history.py')
          text = scanner.read_text()
          fixture = '        "services/qualification/test_history_scan.py",\n'
          if fixture not in text:
              text = text.replace(
                  '        "tools/validate_repository.py",\n',
                  '        "tools/validate_repository.py",\n' + fixture,
              )
          scanner.write_text(text)

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text().replace(
              'run: tools/run_native_sanitizers.sh ',
              'run: bash tools/run_native_sanitizers.sh ',
          )
          workflow.write_text(text)
          PYCODE
      - name: Run repository and Python gates
        run: |
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
      - name: Scan all fetched history without revealing matches
        run: python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
      - name: Run native ASAN and UBSAN gate
        run: bash tools/run_native_sanitizers.sh build/evidence/source-native-sanitizer.json
      - name: Verify patch quality
        run: git diff --check
      - name: Commit the verified final source tree and remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/g5-finalize.yml .github/workflows/g5-export.yml
          git add -A
          git commit -m 'fix(g5): close independent-audit source blockers'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g5
