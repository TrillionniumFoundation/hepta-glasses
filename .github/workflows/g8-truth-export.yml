name: g8-truth-export

on:
  push:
    branches:
      - ops/hepta-g8-truth-export-20260831

permissions:
  contents: write

concurrency:
  group: g8-truth-export-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SHA: 0b52e35683bc56f756473d5341c87af18585630c
  SOURCE_BRANCH: work/hepta-glasses-g8-truth-materialize
  READY_BRANCH: work/hepta-glasses-g8-truth-ready

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Materialize migration if still staged
        run: |
          set -euo pipefail
          if test -f .github/g8_truth_transform.py; then
            python3 .github/g8_truth_transform.py
          fi
      - name: Canonicalize and validate source truth
        run: |
          set -euo pipefail
          dart format lib test
          python3 tools/validate_repository.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          find services adapters tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
      - name: Create one-parent clean candidate commit
        id: candidate
        run: |
          set -euo pipefail
          git add -A
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='Tomasrgbsf'
          export GIT_AUTHOR_EMAIL='tomasbraynt@gmail.com'
          export GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          commit="$({
            printf '%s\n\n' 'refactor(g8): establish canonical product and evidence truth'
            printf '%s\n' 'Signed-off-by: Tomasrgbsf <tomasbraynt@gmail.com>'
          } | git commit-tree "$tree" -p "$BASE_SHA")"
          git update-ref refs/heads/g8-truth-ready "$commit"
          git push --force origin "$commit:refs/heads/$READY_BRANCH"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          mkdir -p build/export
          printf '%s\n' "$commit" > build/export/candidate-sha.txt
          git archive --format=tar.gz --output=build/export/hepta-g8-truth-source.tar.gz "$commit"
          sha256sum build/export/hepta-g8-truth-source.tar.gz > build/export/hepta-g8-truth-source.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-g8-truth-export-${{ steps.candidate.outputs.sha }}
          path: build/export
          if-no-files-found: error
          retention-days: 7
