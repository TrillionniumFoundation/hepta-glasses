name: hepta-hg0087-source-close-transaction

on:
  pull_request:
    paths:
      - '.github/workflows/hepta-source-snapshot-probe.yml'
      - 'tools/.hg0087-closure/**'

permissions:
  contents: write

concurrency:
  group: hepta-hg0087-source-close-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable transaction input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$HEAD_BRANCH" = 'work/hepta-g10-trusted-openssl-custody-20260902'
          for part in part00 part01 part02 part03; do
            test -f "tools/.hg0087-closure/$part"
          done
      - name: Materialize source closure
        run: |
          set -euo pipefail
          cat tools/.hg0087-closure/part00 \
              tools/.hg0087-closure/part01 \
              tools/.hg0087-closure/part02 \
              tools/.hg0087-closure/part03 > /tmp/hepta-apply-hg0087.py
          echo '4e9365ce4b688fb4fc75c0065cdd397a3453a5d7657bdbad8619a0274f0e4991  /tmp/hepta-apply-hg0087.py' | sha256sum -c -
          python3 /tmp/hepta-apply-hg0087.py
          git rm -r tools/.hg0087-closure
      - name: Validate intended final source tree
        run: |
          set -euo pipefail
          mv .github/workflows/hepta-source-snapshot-probe.yml /tmp/hepta-source-transaction.yml
          trap 'mv /tmp/hepta-source-transaction.yml .github/workflows/hepta-source-snapshot-probe.yml' EXIT
          python3 -m unittest -v services.qualification.test_hg0087_source_status
          python3 tools/validate_source_coverage.py >/tmp/source-coverage.json
          python3 tools/validate_module_handoff.py >/tmp/module-handoff.json
          python3 tools/validate_repository.py
          python3 tools/validate_repository_metadata.py
          python3 tools/validate_production_authority.py
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 -m unittest discover -s adapters -p 'test_*.py'
          python3 -m compileall -q services adapters tools
          mv /tmp/hepta-source-transaction.yml .github/workflows/hepta-source-snapshot-probe.yml
          trap - EXIT
          git add \
            docs/CURRENT_STATE.md \
            docs/EVIDENCE_INDEX.yaml \
            docs/HG0087_IMPLEMENTATION_STATUS.json \
            docs/MODULE_COVERAGE.json \
            docs/MODULE_HANDOFF.json \
            docs/PROJECT_STATE.json \
            docs/README.md \
            docs/REMEDIATION_GAP_LEDGER.json \
            docs/development/2026-09-03_BLOCKER_EXECUTION_PLAN.md \
            docs/development/HG0087_PRODUCTION_IMPLEMENTATION.md \
            docs/development/MODULE_HANDOFF.md \
            docs/operations/HG0087_PRODUCTION_RUNTIME_RUNBOOK.md \
            services/qualification/test_hg0087_source_status.py
          git diff --cached --check
      - name: Fast-forward verified source closure
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close HG-0087 repository source scope'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
