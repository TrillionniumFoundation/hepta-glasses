name: hepta-model-wire-hardening-retry-once

on:
  push:
    branches:
      - codex/hepta-identity-migration-20260910

permissions:
  contents: write

concurrency:
  group: hepta-model-wire-hardening-retry-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RETRY_BASE_SHA: 379634657a75834ac37f89a3a75fd8017a399a52
      TARGET_BRANCH: codex/hepta-identity-migration-20260910
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact retry bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$RETRY_BASE_SHA"
          changed="$(git diff --name-only "$RETRY_BASE_SHA" HEAD)"
          test "$changed" = ".github/workflows/model-wire-hardening-retry-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Reapply reviewed transformation and repair fixture indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/model-wire-hardening-once.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = textwrap.dedent(source[start:end])
          Path('/tmp/model-wire-patch.py').write_text(payload + '\n', encoding='utf-8')
          PY
          python3 /tmp/model-wire-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('services/model_gateway/test_app.py')
          text = path.read_text(encoding='utf-8')
          bad = '''    def test_closed_response_omits_provider_and_task_metadata(self) -> None:
              request = validate_chat_request(
                  {"question": "status", "task_id": "task-1", "context": {}}
              )
              self.assertEqual(set(deterministic_answer(request)), {"answer"})

              def test_unknown_field_fails_closed(self) -> None:
          '''
          good = '''    def test_closed_response_omits_provider_and_task_metadata(self) -> None:
              request = validate_chat_request(
                  {"question": "status", "task_id": "task-1", "context": {}}
              )
              self.assertEqual(set(deterministic_answer(request)), {"answer"})

              def test_unknown_field_fails_closed(self) -> None:
          '''
          # The YAML shell de-indentation removes ten leading spaces. At runtime
          # the defective method body is at four spaces and the corrected body
          # must be at eight. Express the exact runtime strings explicitly.
          bad = bad.replace('              request', '    request').replace(
              '                  {"question"', '        {"question"'
          ).replace('              )', '    )').replace(
              '              self.assertEqual', '    self.assertEqual'
          ).replace('              def test_unknown', '    def test_unknown')
          good = good.replace('              request', '        request').replace(
              '                  {"question"', '            {"question"'
          ).replace('              )', '        )').replace(
              '              self.assertEqual', '        self.assertEqual'
          ).replace('              def test_unknown', '    def test_unknown')
          if text.count(bad) != 1:
              raise SystemExit(f'expected one malformed fixture block, observed {text.count(bad)}')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          Path('.github/workflows/model-wire-hardening-retry-once.yml').unlink()
          PY
      - name: Validate exact model boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q services/model_gateway
          python3 -m unittest services.model_gateway.test_app -v
          flutter pub get
          dart format lib/runtime/model_gateway.dart test/runtime/model_gateway_test.dart
          flutter test test/runtime/model_gateway_test.dart
          flutter analyze --no-fatal-infos
          git diff --check
          test ! -e .github/workflows/model-wire-hardening-once.yml
          test ! -e .github/workflows/model-wire-hardening-retry-once.yml
      - name: Publish exact tested source successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hepta-source-closure-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no source changes produced' >&2; exit 1; }
          git commit -m 'security: fail model requests before unauthenticated egress'
          git push origin "HEAD:${TARGET_BRANCH}"
