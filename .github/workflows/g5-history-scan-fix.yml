name: g5-history-scan-scope-fix

on:
  push:
    branches:
      - codex/hepta-glasses-gap-closure-g5

permissions:
  contents: write

concurrency:
  group: hepta-g5-final-fixes
  cancel-in-progress: false

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Eliminate unreported history-scan exclusions
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          scanner = Path('tools/scan_git_history.py')
          text = scanner.read_text()
          text = text.replace(
              '    if path in PATTERN_DEFINITION_PATHS or b"\\x00" in data:\n',
              '    if path in PATTERN_DEFINITION_PATHS:\n',
          )
          text = text.replace(
              '        if size > MAX_BLOB_BYTES:\n'
              '            skipped_large_blobs += 1\n'
              '            continue\n',
              '        if size > MAX_BLOB_BYTES:\n'
              '            raise RuntimeError(\n'
              '                f"history blob {object_id} exceeds the auditable size limit"\n'
              '            )\n',
          )
          if 'b"\\x00" in data' in text or 'skipped_large_blobs += 1' in text:
              raise SystemExit('history scanner still silently skips content')
          scanner.write_text(text)

          gate = Path('services/qualification/release_gate.py')
          text = gate.read_text()
          old = '''            and int(history.get("scanned_blob_count", 0)) > 0
                      and int(history.get("finding_count", -1)) == 0,'''
          new = '''            and int(history.get("scanned_blob_count", 0)) > 0
                      and int(history.get("skipped_large_blob_count", -1)) == 0
                      and int(history.get("finding_count", -1)) == 0,'''
          if old not in text:
              # Formatting may have been normalized; use the compact exact fragment.
              old = '            and int(history.get("scanned_blob_count", 0)) > 0\n            and int(history.get("finding_count", -1)) == 0,'
              new = '            and int(history.get("scanned_blob_count", 0)) > 0\n            and int(history.get("skipped_large_blob_count", -1)) == 0\n            and int(history.get("finding_count", -1)) == 0,'
          if isinstance(old, tuple):
              old = old[0]
              new = new[0]
          if old not in text:
              raise SystemExit('release gate history condition was not found')
          gate.write_text(text.replace(old, new, 1))

          builder = Path('tools/build_source_evidence.py')
          text = builder.read_text()
          marker = '                "scanned_blob_count": history["scanned_blob_count"],\n'
          addition = marker + '                "skipped_large_blob_count": history["skipped_large_blob_count"],\n'
          if '"skipped_large_blob_count": history[' not in text:
              if marker not in text:
                  raise SystemExit('source evidence history summary marker missing')
              text = text.replace(marker, addition, 1)
          builder.write_text(text)

          tests = Path('services/qualification/test_release_gate.py')
          text = tests.read_text()
          marker = '                "scanned_blob_count": 10,\n'
          addition = marker + '                "skipped_large_blob_count": 0,\n'
          if '"skipped_large_blob_count": 0' not in text:
              if marker not in text:
                  raise SystemExit('release-gate fixture marker missing')
              text = text.replace(marker, addition, 1)
          tests.write_text(text)
          PYCODE
      - name: Run source evidence and scanner tests
        run: |
          python3 -m unittest services.qualification.test_history_scan
          python3 -m unittest services.qualification.test_release_gate
          python3 -m unittest discover -s services -p 'test_*.py'
          python3 tools/scan_git_history.py --output build/evidence/source-history-scan.json
          python3 -m compileall -q services tools
          git diff --check
      - name: Commit tested scope fix and remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/g5-history-scan-fix.yml \
            .github/workflows/g5-audit-lock-fix.yml \
            .github/workflows/g5-audit-lock-fix-v2.yml \
            .github/workflows/g5-finalize.yml \
            .github/workflows/g5-remediate.yml \
            .github/workflows/g5-export.yml
          rm -f tools/apply_g5_repository_closure.py
          git add -A
          git commit -m 'fix(g5): make Git history scan scope fail closed'
          git push origin HEAD:codex/hepta-glasses-gap-closure-g5
