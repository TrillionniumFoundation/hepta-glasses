name: hepta-pr113-reconcile-after-pr111

on:
  push:
    branches:
      - 'ops/hepta-pr111-audit-20260909-v1'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: hepta-pr113-reconcile-after-pr111
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Re-audit PR 111 exact-head packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ops/audit_source_packet.py \
            --repository '${{ github.repository }}' \
            --token "$GH_TOKEN" \
            --pr 111 \
            --branch 'codex/hepta-version-authority-20260908' \
            --expected-base 'codex/hepta-critical-test-depth-20260908' \
            --parent-branch 'codex/hepta-critical-test-depth-20260908' \
            --sentinel 'docs/development/VERSION_AUTHORITY_REBASE_READY' \
            --timeout-seconds 2100
      - name: Reconcile the PR 113 stack exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$GH_REPOSITORY"
          parent_branch='codex/hepta-version-authority-20260908'
          old_base_branch='codex/hepta-mobile-product-identity-20260908'
          archive_branch='codex/hepta-source-artifact-durability-20260908'
          sentinel='docs/development/SOURCE_ARTIFACT_DURABILITY_REBASE_READY'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${repository}.git"

          pr_json="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/pulls/113")"
          base_ref="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["ref"])' <<<"$pr_json")"
          base_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])' <<<"$pr_json")"
          old_head="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"$pr_json")"

          git clone --filter=blob:none "$remote" repository
          cd repository
          git fetch origin \
            "refs/heads/${parent_branch}:refs/remotes/origin/${parent_branch}" \
            "refs/heads/${archive_branch}:refs/remotes/origin/${archive_branch}"
          parent_head="$(git rev-parse "origin/${parent_branch}")"
          test "$(git rev-parse "origin/${archive_branch}")" = "$old_head"

          if [ "$base_ref" = "$parent_branch" ]; then
            git merge-base --is-ancestor "$parent_head" "$old_head"
            git cat-file -e "${old_head}:${sentinel}"
            echo "PR #113 is already correctly stacked at ${old_head}."
            exit 0
          fi
          test "$base_ref" = "$old_base_branch"
          git merge-base --is-ancestor "$base_sha" "$parent_head"
          git merge-base --is-ancestor "$base_sha" "$old_head"
          test -z "$(git rev-list --merges "${base_sha}..${old_head}")"
          test "$(git rev-list --count "${base_sha}..${old_head}")" -gt 0

          git checkout -B archive-work "origin/${archive_branch}"
          git rebase --onto "$parent_head" "$base_sha" archive-work
          test "$(git rev-list --count "${parent_head}..HEAD")" -gt 0
          test -z "$(git rev-list --merges "${parent_head}..HEAD")"
          mkdir -p "$(dirname "$sentinel")"
          : > "$sentinel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$sentinel"
          git commit -m 'chore: bind source archive durability to qualified version parent'
          new_head="$(git rev-parse HEAD)"
          git push origin \
            --force-with-lease="refs/heads/${archive_branch}:${old_head}" \
            "HEAD:refs/heads/${archive_branch}"

          curl --fail --silent --show-error \
            -X PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/pulls/113" \
            -d "$(python3 -c 'import json; print(json.dumps({"base":"codex/hepta-version-authority-20260908","title":"[DRAFT / REQUALIFYING] durable source Artifact receipt on qualified version parent"}))')" \
            >/dev/null
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${repository}/issues/113/comments" \
            -d "$(python3 - "$parent_head" "$new_head" <<'PY'
          import json, sys
          parent, head = sys.argv[1:]
          print(json.dumps({'body': (
              '## Idempotent stack reconciliation completed\n\n'
              f'PR #113 was linearly replayed on PR #111 head `{parent}` and now points to `{head}`. '
              'No CI, Artifact, review, archive receipt or prospective-merge evidence transfers from the old head.'
          )}))
          PY
          )" \
            >/dev/null
