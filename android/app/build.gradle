plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Canonical source, generated-code and installed application namespace.
    // A future change requires an explicit data/signing/store migration.
    namespace = "org.trillionnium.heptaglasses"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    defaultConfig {
        // Canonical installed application identity. Changing it requires a migration and release-signing review.
        applicationId = "org.trillionnium.heptaglasses"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters  'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // Product signing is injected by the release pipeline.
            // Never fall back to the debug key for a distributable build.
            signingConfig = null
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.23'
    testImplementation 'junit:junit:4.13.2'
}
